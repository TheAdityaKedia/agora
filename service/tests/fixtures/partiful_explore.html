nd in a display case. It moved through my\ngrandparents, Elijah and Esther Oswago, and then my mother, Bernadette Oswago; it now takes\nshape through Motebii in the Bay Area. \nThis workshop is an opportunity to participate in the next hand in the chain. \nYou'll see, feel, and learn about one of Kenya's art forms.\n\nWhere - African American Art & Culture Complex\nNia Room - Second floor\nCost - Free admission\nParking - Free; lot next to the building\nDress code - Sharp\n\nI look forward to seeing and speaking with you all.\n\nWith love,\nMworia. LK.", "locationInfo": {"type": "structured", "hasPostCode": true, "mapsInfo": {"addressLines": ["762 Fulton St", "San Francisco, CA 94102"], "approximateLocation": "San Francisco, CA", "appleMapsUrl": "http://maps.apple.com/?address=762%20Fulton%20St%2C%20San%20Francisco%2C%20CA%2094102&sll=37.78,-122.43", "googleMapsUrl": "https://www.google.com/maps/search/?api=1&query=762%20Fulton%20St%2C%20San%20Francisco%2C%20CA%2094102"}, "displayAddressLines": ["762 Fulton St", "San Francisco, CA"], "neighborhood": "Western Addition"}, "startDate": "2026-10-01T00:30:00.000Z", "endDate": "2026-10-01T03:00:00.000Z", "timezone": "America/Los_Angeles", "ownerIds": ["G8iwBARbAlckZAifUs8DcYPV5nD3"], "interestedGuestCount": 4, "goingGuestCount": 8, "approvedGuestCount": 0, "maybeGuestCount": 7, "waitlistGuestCount": 0, "showGuestCount": true, "isPublic": true, "status": "PUBLISHED", "image": {"source": "upload", "type": "image", "upload": {"path": "external/user/G8iwBARbAlckZAifUs8DcYPV5nD3/a3Fp_hAsIlRCsi0lopmMH", "url": "https://firebasestorage.googleapis.com/v0/b/getpartiful.appspot.com/o/external%2Fuser%2FG8iwBARbAlckZAifUs8DcYPV5nD3%2Fa3Fp_hAsIlRCsi0lopmMH?alt=media", "contentType": "image/jpeg"}, "url": "https://firebasestorage.googleapis.com/v0/b/getpartiful.appspot.com/o/external%2Fuser%2FG8iwBARbAlckZAifUs8DcYPV5nD3%2Fa3Fp_hAsIlRCsi0lopmMH?alt=media", "contentType": "image/jpeg", "name": "a3Fp_hAsIlRCsi0lopmMH", "height": 1999, "w
