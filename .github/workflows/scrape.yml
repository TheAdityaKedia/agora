name: Scrape and refresh manifest

# One runner per source (speed, fresh IP, fault isolation), fanned back in to a
# single DB writer. Stages: service/ci.py; setup + ops: README.md →
# "Scheduled scraping".
#
# Runs from main use the production Neon DB, ship to main, and deploy Pages.
# Runs from any other branch (for testing the workflow itself) use the
# `ci-test` environment's Neon branch and ship into a throwaway ci-sandbox/<run_id>
# branch — the full PR → merge path is exercised, but nothing reaches main.
on:
  schedule:
    # Off the top of the hour: GitHub delays or drops scheduled runs under
    # load, worst at :00 (the first 0 10 * * * slot never fired). UTC times:
    - cron: "23 10 * * *" # daily run, 3:23am PT (2:23am in winter)
    - cron: "23 14 * * *" # backup, 7:23am PT — skips if today's run happened
  workflow_dispatch:
    inputs:
      sources:
        description: "Only scrape sources whose URL contains one of these space-separated substrings (blank = all)"
        required: false
        default: ""

# One run at a time: runs share the Neon DB and events.json.
concurrency:
  group: scrape-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCES: ${{ inputs.sources }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # backup check lists this workflow's runs
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: service/requirements.txt
      - name: Backup slot — skip if today's scheduled run already happened
        id: backup
        if: github.event_name == 'schedule' && github.event.schedule == '23 14 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Start of today in Pacific time, as UTC. Only *scheduled* runs count:
          # a manual (possibly filtered) run doesn't replace the daily full run.
          since="$(python -c 'from datetime import datetime, time, timezone
          from zoneinfo import ZoneInfo
          pt = ZoneInfo("America/Los_Angeles")
          start = datetime.combine(datetime.now(pt).date(), time.min, pt)
          print(start.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))')"
          n="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/scrape.yml/runs?branch=main&event=schedule&created=%3E%3D$since&per_page=100" \
                --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)] | length")"
          echo "scheduled runs today before this one: $n"
          if [ "$n" != "0" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - run: pip install -r service/requirements.txt
        if: steps.backup.outputs.skip != 'true'
      - id: plan
        working-directory: service
        env:
          SKIP: ${{ steps.backup.outputs.skip }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "Today's run already happened; backup run does nothing."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -f  # user input: split on spaces, but never glob
          # shellcheck disable=SC2086
          echo "matrix=$(python ci.py plan --sources $SOURCES)" >> "$GITHUB_OUTPUT"

  scrape:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    name: scrape (${{ matrix.source.url }})
    runs-on: ubuntu-latest
    # Well above any healthy single-source scrape (a few minutes); a hung
    # scraper is cut off here and its source counts as "missing".
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: service/requirements.txt
      - run: pip install -r service/requirements.txt
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('service/requirements.txt') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium
      - name: Scrape
        working-directory: service
        env:
          URL: ${{ matrix.source.url }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: python ci.py scrape --url "$URL" --out result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: result-${{ matrix.source.index }}
          path: service/result.json
          retention-days: 7
          if-no-files-found: ignore

  merge:
    needs: [plan, scrape]
    # Run even when scrape jobs failed — missing results keep their DB rows.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write    # failure-alert issue
      actions: write   # gh workflow run deploy-pages.yml
      id-token: write  # AWS OIDC
    # Secrets live in GitHub Environments, not the repo: `production` (Neon
    # production, AWS role) only accepts deployments from main, so no other
    # branch's workflow can read them; `ci-test` holds the test-branch DB URL.
    environment: ${{ github.ref_name == 'main' && 'production' || 'ci-test' }}
    # One Neon writer at a time across workflows (ingest-email.yml uses the
    # same group).
    concurrency:
      group: neon-writer-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      IS_MAIN: ${{ github.ref_name == 'main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: service/requirements.txt
      - run: pip install -r service/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
      - name: AWS credentials for Bedrock
        # Missing/broken creds only skip tagging; the manifest still ships.
        if: env.IS_MAIN == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Merge into DB, classify, export
        working-directory: service
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}  # environment-scoped (see above)
          EVENTS_JSON_PATH: ${{ github.workspace }}/frontend/events.json
        run: |
          set -f
          # shellcheck disable=SC2086
          python ci.py merge --dir "$GITHUB_WORKSPACE/results" \
            --report "$RUNNER_TEMP/report.json" --sources $SOURCES
      - name: Find failing sources
        id: alert
        working-directory: service
        run: |
          python ci.py alert --report "$RUNNER_TEMP/report.json" \
            --body "$RUNNER_TEMP/alert.md" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --mention "@$GITHUB_REPOSITORY_OWNER" >> "$GITHUB_OUTPUT"
      - name: Ship manifest
        uses: ./.github/actions/ship-manifest
        with:
          report: ${{ runner.temp }}/report.json
          gh-token: ${{ github.token }}
          is-main: ${{ env.IS_MAIN }}
      # Alerting: hard failures + 0-event sources (known CI-blocked sources
      # excluded) open or update one "Scrape failures" issue — GitHub emails
      # the repo owner — and the run is marked failed. A clean run closes it.
      # Runs after shipping so a failing source never blocks the data refresh.
      - name: Alert issue
        if: always() && steps.alert.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.alert.outputs.count }}
          TITLE: ${{ github.ref_name == 'main' && 'Scrape failures' || format('Scrape failures (test run on {0})', github.ref_name) }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --search "\"$TITLE\" in:title" \
                      --json number,title -q ".[] | select(.title == \"$TITLE\") | .number" | head -1)"
          if [ "$COUNT" != "0" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file "$RUNNER_TEMP/alert.md"
            else
              gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/alert.md"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Clean run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - name: Fail run on source failures
        if: always() && steps.alert.outcome == 'success' && steps.alert.outputs.count != '0'
        env:
          COUNT: ${{ steps.alert.outputs.count }}
        run: |
          echo "::error::${COUNT} source(s) failed — see the Scrape failures issue"
          exit 1

  # Heartbeat for the hourly email job, which can't notice its own absence
  # (GitHub drops scheduled runs; it has dropped this repo's before). If no
  # ingest-email.yml run on main has succeeded in the last 6 hours, post to the
  # "Email ingest failures" issue (@mentions the owner) and go red. A paused job
  # (EMAIL_INGEST=off) still runs and succeeds, so pausing doesn't trigger this.
  ingest-heartbeat:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Check the email job ran recently
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_HOURS: "6"
          TITLE: Email ingest failures
        run: |
          set -euo pipefail
          last="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ingest-email.yml/runs?branch=main&status=success&per_page=1" \
                  --jq '.workflow_runs[0].created_at // ""')"
          if [ -n "$last" ]; then
            age_h=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
            if [ "$age_h" -lt "$MAX_AGE_HOURS" ]; then
              echo "Email job last succeeded ${age_h}h ago ($last)."
              exit 0
            fi
            body="The email ingest job hasn't succeeded in ${age_h} hours (last success: $last). GitHub may be dropping its schedule — check https://github.com/$GITHUB_REPOSITORY/actions/workflows/ingest-email.yml @$GITHUB_REPOSITORY_OWNER"
          else
            body="The email ingest job has no successful run on main. @$GITHUB_REPOSITORY_OWNER"
          fi
          n="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
                -q ".[] | select(.title == \"$TITLE\") | .number" | head -1)"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$TITLE" --body "$body"; fi
          echo "::error::$body"
          exit 1
