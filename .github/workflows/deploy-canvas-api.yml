name: Deploy canvas API

# Event canvases backend (canvas/), infrastructure as code with CDK
# (canvas/infra). Every push that touches canvas/ runs the tests and a synth;
# then `cdk deploy`: a branch → AgoraCanvasDev (smoke-tested),
# main → AgoraCanvasProd + AgoraCanvasCi (the deploy role itself).
# The deploy job is skipped until the one-time bootstrap in canvas/README.md
# has created the role and set the CANVAS_DEPLOY_ROLE_ARN repo variable.

on:
  push:
    paths:
      - 'canvas/**'
      - '.github/workflows/deploy-canvas-api.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CDK_CLI: aws-cdk@2.1144.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            canvas/requirements-dev.txt
            canvas/infra/requirements.txt
      - run: pip install -r canvas/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: canvas
      - name: CDK synth
        working-directory: canvas/infra
        run: npx -y "$CDK_CLI" synth --quiet

  deploy:
    needs: test
    if: vars.CANVAS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # AWS OIDC
    env:
      STAGE: ${{ github.ref == 'refs/heads/main' && 'Prod' || 'Dev' }}
    concurrency:
      group: canvas-api-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: canvas/infra/requirements.txt
      - run: pip install -r canvas/infra/requirements.txt
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CANVAS_DEPLOY_ROLE_ARN }}
          # Not secrets.AWS_REGION: that one is scoped to the `production`
          # environment (main-only), which this job deliberately doesn't use.
          aws-region: us-east-1
      - name: CDK deploy
        working-directory: canvas/infra
        env:
          CANVAS_IP_SALT: ${{ secrets.CANVAS_IP_SALT }}
          CANVAS_BUDGET_EMAIL: ${{ vars.CANVAS_BUDGET_EMAIL }}
          CANVAS_RESERVED_CONCURRENCY: ${{ vars.CANVAS_RESERVED_CONCURRENCY }}
        run: |
          stacks="AgoraCanvas$STAGE"
          [ "$STAGE" = Prod ] && stacks="$stacks AgoraCanvasCi"
          # shellcheck disable=SC2086
          npx -y "$CDK_CLI" deploy $stacks --require-approval never \
            --outputs-file "$RUNNER_TEMP/outputs.json"
          url=$(jq -r ".AgoraCanvas$STAGE.ApiUrl" "$RUNNER_TEMP/outputs.json")
          echo "API_URL=${url%/}" >> "$GITHUB_ENV"
          echo "Canvas API ($STAGE): $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test (dev only)
        if: env.STAGE == 'Dev'
        run: python canvas/scripts/smoke.py "$API_URL"
