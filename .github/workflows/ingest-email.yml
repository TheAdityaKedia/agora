name: Ingest email submissions

# Hourly: read the submissions Gmail inbox, turn text/links/screenshots into
# events, save to Neon as "Community submissions", reply on failure, ship.
# Docs: README.md → "Event submissions by email".
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'ci-test' }}
    concurrency:
      group: neon-writer-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    env:
      IS_MAIN: ${{ github.ref_name == 'main' }}
    steps:
      - name: Kill switch and yield to the daily scrape
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLED: ${{ vars.EMAIL_INGEST }}
        run: |
          if [ "$ENABLED" = "off" ]; then echo "EMAIL_INGEST=off; skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          running="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/scrape.yml/runs?branch=$GITHUB_REF_NAME&status=in_progress" --jq '.total_count')"
          if [ "$running" != "0" ]; then echo "A scrape run is in progress; next hour will pick up the mail."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v7
        # The branch tip at job start, not the trigger commit: this job waits on
        # the neon-writer lock, and the other writer may merge a data PR meanwhile
        # (a stale base conflicts and misses its new tags).
        with:
          ref: ${{ github.ref_name }}
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: service/requirements.txt
      - if: steps.gate.outputs.go == 'true'
        run: pip install -r service/requirements.txt
      - if: steps.gate.outputs.go == 'true'
        name: AWS credentials for Bedrock
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - if: steps.gate.outputs.go == 'true'
        name: Ingest
        id: ingest
        working-directory: service
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUBMISSION_HASH_KEY: ${{ secrets.SUBMISSION_HASH_KEY }}
          SUBMISSION_IMAGE_BUCKET: ${{ secrets.SUBMISSION_IMAGE_BUCKET }}
          SUBMISSION_IMAGE_BASE_URL: ${{ secrets.SUBMISSION_IMAGE_BASE_URL }}
          EVENTS_JSON_PATH: ${{ github.workspace }}/frontend/events.json
        run: |
          python -m ingest.run --report "$RUNNER_TEMP/report.json" --outputs "$GITHUB_OUTPUT" \
            --warnings "$RUNNER_TEMP/warnings.md"
      - if: steps.gate.outputs.go == 'true' && steps.ingest.outputs.saved != '0'
        name: Ship manifest
        uses: ./.github/actions/ship-manifest
        with:
          report: ${{ runner.temp }}/report.json
          gh-token: ${{ github.token }}
          is-main: ${{ env.IS_MAIN }}
      # Alerting (mirrors scrape.yml): a crash, or failures the job swallows
      # so data still ships (tagging skipped, image upload errors), open or
      # comment on one "Email ingest failures" issue that @mentions the owner
      # (GitHub emails them) and turn the run red. A clean run closes it.
      # Per-email problems (no date, blocked link) are not alerts — the
      # sender gets a reply. Runs skipped by the gate don't touch the issue.
      - name: Alert issue
        if: always() && steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          WARNINGS: ${{ steps.ingest.outputs.warnings }}
          TITLE: ${{ github.ref_name == 'main' && 'Email ingest failures' || format('Email ingest failures (test run on {0})', github.ref_name) }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
                -q ".[] | select(.title == \"$TITLE\") | .number" | head -1)"
          if [ "$JOB_STATUS" != "success" ]; then
            body="The email ingest job failed: $run_url @$GITHUB_REPOSITORY_OWNER"
          elif [ "${WARNINGS:-0}" != "0" ]; then
            body="$(printf 'The email ingest job hit problems it worked around ([run](%s)) @%s\n\n%s\n\nSubmissions still shipped; affected ones may be untagged or missing their image.' \
                    "$run_url" "$GITHUB_REPOSITORY_OWNER" "$(cat "$RUNNER_TEMP/warnings.md")")"
          else
            if [ -n "$n" ]; then gh issue close "$n" --comment "Clean run: $run_url"; fi
            exit 0
          fi
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$TITLE" --body "$body"; fi
      - name: Fail run on warnings
        if: steps.gate.outputs.go == 'true' && steps.ingest.outputs.warnings != '0' && steps.ingest.outputs.warnings != ''
        env:
          WARNINGS: ${{ steps.ingest.outputs.warnings }}
        run: |
          echo "::error::${WARNINGS} problem(s) worked around — see the Email ingest failures issue"
          exit 1
