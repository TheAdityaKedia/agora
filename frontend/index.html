<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agora — SF Events</title>
<style>
  :root {
    --fg: #1a1a1a;
    --muted: #666;
    --accent: #0057b7;
    --accent-fg: #ffffff;
    --bg: #fafaf7;
    --chip-bg: #eeeeea;
    --border: #e5e5e5;
    --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e8e8e8; --muted: #999; --accent: #7ab7ff; --accent-fg: #0a1a2a;
      --bg: #111; --chip-bg: #222; --border: #2a2a2a; --input-bg: #1a1a1a;
    }
  }
  * { box-sizing: border-box; }
  /* Ensure the hidden attribute wins over `display: flex` set on filter rows. */
  [hidden] { display: none !important; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--fg); background: var(--bg);
    max-width: 720px; margin: 0 auto; padding: 24px;
    line-height: 1.5;
  }
  header { margin-bottom: 20px; }
  h1 { margin: 0; font-size: 32px; letter-spacing: -0.02em; }
  .subtitle { color: var(--muted); margin-top: 4px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 12px; }

  .filters {
    display: flex; flex-direction: column; gap: 12px;
    padding: 12px 0 4px;
    margin-bottom: 8px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .filter-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 6px 0;
  }
  .filter-row.search-row {
    gap: 12px;
  }
  .filter-row.search-row input[type="search"] {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--input-bg); color: var(--fg);
    font: inherit; font-size: 14px;
    outline: none;
  }
  .filter-row.search-row input[type="search"]:focus {
    border-color: var(--accent);
  }
  .filter-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 600;
    flex: 0 0 60px;
  }
  .dropdown { position: relative; }
  .dropdown > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--chip-bg); color: var(--fg);
    font-size: 13px; border: 1px solid var(--border);
  }
  .dropdown > summary::-webkit-details-marker { display: none; }
  .dropdown > summary::after {
    content: "▾"; font-size: 10px; opacity: 0.6;
  }
  .dropdown[open] > summary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .dropdown-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 10;
    min-width: 280px; max-width: 360px;
    max-height: min(70vh, 480px);
    background: var(--input-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; display: flex; flex-direction: column; gap: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  .dropdown-scroll {
    overflow-y: auto;
    max-height: 100%;
  }
  .dropdown-empty { padding: 12px; color: var(--muted); font-size: 13px; text-align: center; }
  .dropdown-search {
    padding: 4px 4px 8px;
  }
  .dropdown-search input {
    width: 100%;
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit; font-size: 13px;
    outline: none;
  }
  .dropdown-search input:focus { border-color: var(--accent); }
  .dropdown-bulk {
    display: flex; gap: 6px; padding: 4px 4px 8px;
    border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }
  .dropdown-bulk button {
    padding: 3px 8px; border-radius: 6px;
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    font-size: 12px; cursor: pointer;
  }
  .dropdown-bulk button:hover { color: var(--fg); }
  .dropdown-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 6px; border-radius: 6px; cursor: pointer;
    font-size: 13px;
  }
  .dropdown-item:hover { background: var(--chip-bg); }
  .dropdown-item .count {
    margin-left: auto; font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .date-input {
    padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--input-bg); color: var(--fg); font: inherit; font-size: 13px;
    color-scheme: light dark;
  }
  .reset-btn {
    padding: 4px 10px; border-radius: 999px;
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    font-size: 13px; cursor: pointer;
    margin-left: auto;
  }
  .reset-btn:hover { color: var(--fg); }
  .copy-btn {
    padding: 4px 10px; border-radius: 999px;
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    font-size: 13px; cursor: pointer;
  }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
  .copy-btn.copied {
    color: var(--accent-fg); background: var(--accent); border-color: var(--accent);
  }
  .preset-btn {
    padding: 4px 10px; border-radius: 999px;
    background: var(--chip-bg); color: var(--fg); border: 1px solid var(--border);
    font-size: 13px; cursor: pointer;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--accent); }
  .preset-btn.active {
    background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
  }

  h2.date {
    margin: 32px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 600;
  }
  .event { display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .event:last-child { border-bottom: none; }
  .time {
    flex: 0 0 72px; color: var(--muted); font-variant-numeric: tabular-nums;
    font-size: 14px; padding-top: 2px;
  }
  .event .time { line-height: 1.3; }
  /* Search-active flat rows put a full date + time in .time — widen it. */
  body.searching .time { flex: 0 0 140px; }
  .thumb {
    flex: 0 0 72px; width: 72px; height: 72px;
    border-radius: 6px; background: var(--chip-bg);
    overflow: hidden;
  }
  .thumb img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  .details { flex: 1; min-width: 0; }
  .title a { color: var(--fg); font-weight: 600; text-decoration: none; }
  .title a:hover { color: var(--accent); text-decoration: underline; }
  .location, .source { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .description {
    font-size: 13px; color: var(--muted);
    margin-top: 6px; line-height: 1.45;
  }
  .description[role="button"] { cursor: pointer; }
  .description[role="button"]:hover { color: var(--fg); }
  .description[role="button"]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px;
  }
  .description .desc-full { display: none; white-space: pre-wrap; }
  .description.expanded .desc-preview { display: none; }
  .description.expanded .desc-full { display: inline; }
  .desc-toggle { color: var(--accent); font-weight: 500; margin-left: 2px; }
  .location-btn {
    background: none; border: none; padding: 0; margin: 0;
    color: inherit; font: inherit; text-align: left;
    cursor: pointer; text-decoration: none;
  }
  .location-btn:hover { color: var(--fg); text-decoration: underline; }
  .active-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 4px 3px 10px; border-radius: 999px;
    background: var(--accent); color: var(--accent-fg);
    font-size: 13px; border: 1px solid var(--accent);
    max-width: 100%; min-width: 0;
  }
  .active-pill .pill-label {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .active-pill .pill-clear {
    background: transparent; border: 0; color: inherit; cursor: pointer;
    padding: 0 4px; font-size: 14px; line-height: 1;
    border-radius: 999px;
  }
  .active-pill .pill-clear:hover { background: rgba(255,255,255,0.2); }
  .empty, .error { color: var(--muted); text-align: center; padding: 48px 0; }
  .error { color: #c33; }
</style>
</head>
<body>
<header>
  <h1>Agora</h1>
  <div class="subtitle">SF events, one calendar.</div>
  <div class="meta" id="meta"></div>
</header>

<section class="filters" id="filters" hidden>
  <div class="filter-row search-row">
    <span class="filter-label">Search</span>
    <input type="search" id="search-input" placeholder="Search events…" aria-label="Search events" autocomplete="off">
  </div>
  <div class="filter-row">
    <span class="filter-label">Sources</span>
    <details class="dropdown" id="source-dropdown">
      <summary id="source-summary">Loading…</summary>
      <div class="dropdown-panel">
        <div class="dropdown-search">
          <input type="search" id="source-search" placeholder="Search sources…" aria-label="Search sources" autocomplete="off">
        </div>
        <div class="dropdown-bulk">
          <button type="button" id="select-all">Select all</button>
          <button type="button" id="deselect-all">Deselect all</button>
        </div>
        <div class="dropdown-scroll">
          <div id="source-list"></div>
          <div class="dropdown-empty" id="source-empty" hidden>No sources match.</div>
        </div>
      </div>
    </details>
  </div>
  <div class="filter-row" id="location-row" hidden>
    <span class="filter-label">Location</span>
    <span class="active-pill" id="location-pill">
      <span class="pill-label" id="location-label"></span>
      <button type="button" class="pill-clear" id="location-clear" aria-label="Clear location filter">×</button>
    </span>
  </div>
  <div class="filter-row">
    <span class="filter-label">Dates</span>
    <button type="button" class="preset-btn" id="preset-today">Today</button>
    <button type="button" class="preset-btn" id="preset-week">This week</button>
    <label style="font-size:13px;color:var(--muted)">From
      <input type="date" id="date-from" class="date-input" aria-label="From date">
    </label>
    <label style="font-size:13px;color:var(--muted)">To
      <input type="date" id="date-to" class="date-input" aria-label="To date">
    </label>
    <button id="reset" class="reset-btn">Reset filters</button>
    <button id="copy-link" class="copy-btn" type="button" aria-label="Copy shareable link to this filtered view">Copy link</button>
  </div>
</section>

<main id="list"><div class="empty">Loading…</div></main>

<script src="./vendor/minisearch-6.3.0.min.js"></script>
<script>
(async () => {
  const list = document.getElementById("list");
  const meta = document.getElementById("meta");
  const filters = document.getElementById("filters");
  const sourceListEl = document.getElementById("source-list");
  const sourceEmptyEl = document.getElementById("source-empty");
  const sourceSearchEl = document.getElementById("source-search");
  const summaryEl = document.getElementById("source-summary");
  const selectAllEl = document.getElementById("select-all");
  const deselectAllEl = document.getElementById("deselect-all");
  const fromEl = document.getElementById("date-from");
  const toEl = document.getElementById("date-to");
  const resetEl = document.getElementById("reset");
  const copyEl = document.getElementById("copy-link");
  const presetTodayEl = document.getElementById("preset-today");
  const presetWeekEl = document.getElementById("preset-week");
  const locationRowEl = document.getElementById("location-row");
  const locationLabelEl = document.getElementById("location-label");
  const locationClearEl = document.getElementById("location-clear");
  const sourceDropdownEl = document.getElementById("source-dropdown");
  const searchEl = document.getElementById("search-input");

  let data;
  try {
    const resp = await fetch("./events.json", { cache: "no-cache" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    data = await resp.json();
  } catch (e) {
    list.innerHTML = '<div class="error">Couldn’t load events.json — ' + escapeHtml(e.message) + "</div>";
    return;
  }

  const events = (data.events || []).map((e, i) => ({
    ...e,
    _start: new Date(e.start_time),
    id: i,
    sources_text: (e.sources || []).join(" "),
  }));

  // Build the search index once. See feature-specs/search.md §2.2 for the
  // config rationale.
  const miniSearch = new MiniSearch({
    fields: ["title", "description", "location", "sources_text"],
    storeFields: ["id"],
    searchOptions: {
      boost: {title: 3, description: 1, location: 1, sources_text: 1},
      prefix: true,
      fuzzy: 0.2,
      combineWith: "AND",
    },
  });
  miniSearch.addAll(events);

  const generatedAt = new Date(data.generated_at);

  // State — events carry a `sources` list (a physical event may be listed by
  // multiple sources), so counts and filtering consider every entry in that list.
  // Sources in the manifest are already human-readable names — the backend
  // translated them at export time — so alphabetical sort is the natural order.
  const allSources = [...new Set(events.flatMap(e => e.sources || []))].sort(
    (a, b) => a.localeCompare(b)
  );
  const selected = new Set(allSources);  // all on by default
  let dateFrom = null;
  let dateTo = null;
  let locationFilter = null;

  let searchQuery = "";
  let rankedOrder = null;  // number[] | null — event ids in rank order, null when no search is active

  const SEARCH_SCORE_THRESHOLD = 1.0;  // Drop weak matches — spec §2.4

  function updateSearch() {
    const q = searchEl.value.trim();
    searchQuery = q;
    if (!q) {
      rankedOrder = null;
      document.body.classList.remove("searching");
    } else {
      const results = miniSearch.search(q).filter(r => r.score >= SEARCH_SCORE_THRESHOLD);
      rankedOrder = results.map(r => r.id);
      document.body.classList.add("searching");
    }
    render();
  }
  searchEl.addEventListener("input", updateSearch);

  function setLocationFilter(loc) {
    locationFilter = loc;
    if (loc) {
      locationLabelEl.textContent = loc;
      locationRowEl.hidden = false;
    } else {
      locationRowEl.hidden = true;
    }
    render();
  }
  locationClearEl.addEventListener("click", () => setLocationFilter(null));
  // Event delegation for anything inside the event list.
  list.addEventListener("click", (e) => {
    const locBtn = e.target.closest(".location-btn");
    if (locBtn) { setLocationFilter(locBtn.dataset.location); return; }
    const desc = e.target.closest('.description[role="button"]');
    if (desc) desc.classList.toggle("expanded");
  });
  list.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const desc = e.target.closest('.description[role="button"]');
    if (desc) { e.preventDefault(); desc.classList.toggle("expanded"); }
  });

  // Build source list (checkbox rows, with per-source counts). A multi-source
  // event counts toward each of its sources.
  const sourceCounts = new Map();
  for (const s of allSources) {
    sourceCounts.set(s, events.filter(e => (e.sources || []).includes(s)).length);
  }
  const checkboxes = new Map();  // source -> input element
  for (const s of allSources) {
    const label = document.createElement("label");
    label.className = "dropdown-item";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = true; cb.dataset.source = s;
    cb.addEventListener("change", () => {
      if (cb.checked) selected.add(s); else selected.delete(s);
      updateSourceSummary();
      render();
    });
    checkboxes.set(s, cb);
    label.appendChild(cb);
    const name = document.createElement("span");
    name.textContent = s;
    label.appendChild(name);
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = sourceCounts.get(s);
    label.appendChild(count);
    sourceListEl.appendChild(label);
  }

  selectAllEl.addEventListener("click", () => {
    for (const s of allSources) { selected.add(s); checkboxes.get(s).checked = true; }
    updateSourceSummary();
    render();
  });
  deselectAllEl.addEventListener("click", () => {
    selected.clear();
    for (const cb of checkboxes.values()) cb.checked = false;
    updateSourceSummary();
    render();
  });

  // Live-filter the source list as the user types. Case-insensitive substring
  // match against the source name. Nothing else about the state changes.
  sourceSearchEl.addEventListener("input", () => {
    const q = sourceSearchEl.value.trim().toLowerCase();
    let visible = 0;
    for (const s of allSources) {
      const label = sourceListEl.querySelector(`label input[data-source="${cssEscape(s)}"]`)?.closest("label");
      if (!label) continue;
      const match = !q || s.toLowerCase().includes(q);
      label.hidden = !match;
      if (match) visible++;
    }
    sourceEmptyEl.hidden = visible > 0;
  });
  // Focus the search input each time the dropdown opens.
  sourceDropdownEl.addEventListener("toggle", () => {
    if (sourceDropdownEl.open) sourceSearchEl.focus();
  });
  // Close the dropdown when clicking outside it (native <details> doesn't do this).
  document.addEventListener("click", (e) => {
    if (sourceDropdownEl.open && !sourceDropdownEl.contains(e.target)) {
      sourceDropdownEl.open = false;
    }
  });
  function cssEscape(v) {
    return (window.CSS && CSS.escape) ? CSS.escape(v)
      : String(v).replace(/["\\]/g, "\\$&");
  }

  function updateSourceSummary() {
    const n = selected.size, total = allSources.length;
    if (n === total) summaryEl.textContent = "All sources (" + total + ")";
    else if (n === 0) summaryEl.textContent = "No sources";
    else if (n === 1) summaryEl.textContent = [...selected][0];
    else summaryEl.textContent = n + " of " + total + " sources";
  }
  updateSourceSummary();

  // Format a Date's local calendar day as YYYY-MM-DD for <input type="date">.
  const toISODate = (d) => {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  };
  // Apply an explicit calendar range (Date objects, both inclusive).
  function setDateRange(from, to) {
    fromEl.value = from ? toISODate(from) : "";
    toEl.value = to ? toISODate(to) : "";
    dateFrom = from ? new Date(toISODate(from) + "T00:00:00") : null;
    dateTo   = to   ? new Date(toISODate(to)   + "T23:59:59") : null;
    updatePresetHighlight();
    render();
  }
  // Highlight whichever preset (if any) matches the current from/to values.
  function updatePresetHighlight() {
    presetTodayEl.classList.remove("active");
    presetWeekEl.classList.remove("active");
    const today = new Date();
    const todayStr = toISODate(today);
    if (fromEl.value === todayStr && toEl.value === todayStr) {
      presetTodayEl.classList.add("active");
      return;
    }
    // "This week" = today through the coming Sunday. Week-anchored, not rolling.
    const daysToSunday = (7 - today.getDay()) % 7; // 0 = today is Sunday
    const sunday = new Date(today);
    sunday.setDate(today.getDate() + daysToSunday);
    if (fromEl.value === todayStr && toEl.value === toISODate(sunday)) {
      presetWeekEl.classList.add("active");
    }
  }

  fromEl.addEventListener("input", () => {
    dateFrom = fromEl.value ? new Date(fromEl.value + "T00:00:00") : null;
    updatePresetHighlight();
    render();
  });
  toEl.addEventListener("input", () => {
    dateTo = toEl.value ? new Date(toEl.value + "T23:59:59") : null;
    updatePresetHighlight();
    render();
  });
  // Presets toggle: clicking an active preset clears the date range instead
  // of re-applying it. `.active` is set by updatePresetHighlight() whenever
  // from/to match the preset's range, so it's the authoritative check.
  presetTodayEl.addEventListener("click", () => {
    if (presetTodayEl.classList.contains("active")) {
      setDateRange(null, null);
      return;
    }
    const today = new Date();
    setDateRange(today, today);
  });
  presetWeekEl.addEventListener("click", () => {
    if (presetWeekEl.classList.contains("active")) {
      setDateRange(null, null);
      return;
    }
    const today = new Date();
    const daysToSunday = (7 - today.getDay()) % 7;
    const sunday = new Date(today);
    sunday.setDate(today.getDate() + daysToSunday);
    setDateRange(today, sunday);
  });
  resetEl.addEventListener("click", () => {
    for (const s of allSources) { selected.add(s); checkboxes.get(s).checked = true; }
    updateSourceSummary();
    fromEl.value = ""; toEl.value = ""; dateFrom = dateTo = null;
    updatePresetHighlight();
    searchEl.value = "";
    updateSearch();          // clears searchQuery / rankedOrder, removes .searching, and re-renders
    setLocationFilter(null);
  });

  // --- URL sync: filter state <-> query string ---
  // Every state mutation ends in render(), so writing the URL from render()
  // is the single choke point. `replaceState` (not push) keeps the browser's
  // back button meaningful — users don't want a history entry per keystroke.
  function writeStateToUrl() {
    const p = new URLSearchParams();
    if (searchQuery) p.set("q", searchQuery);
    if (selected.size !== allSources.length) {
      p.set("sources", [...selected].join(","));
    }
    if (fromEl.value) p.set("from", fromEl.value);
    if (toEl.value) p.set("to", toEl.value);
    if (locationFilter) p.set("loc", locationFilter);
    const qs = p.toString();
    const url = qs ? `${location.pathname}?${qs}` : location.pathname;
    if (location.pathname + location.search !== url) {
      history.replaceState(null, "", url);
    }
  }

  // Restore state from ?q=&sources=&from=&to=&loc= on a fresh load. Called
  // once after DOM refs + filter machinery are set up. Silently ignores
  // unknown source names and malformed dates so a shared link survives DB
  // churn.
  function readStateFromUrl() {
    const p = new URLSearchParams(location.search);
    const srcs = p.get("sources");
    if (srcs !== null) {
      const wanted = new Set(srcs.split(",").filter(Boolean));
      selected.clear();
      for (const s of allSources) {
        const on = wanted.has(s);
        if (on) selected.add(s);
        const cb = checkboxes.get(s);
        if (cb) cb.checked = on;
      }
      updateSourceSummary();
    }
    const from = p.get("from");
    const to = p.get("to");
    if (from && /^\d{4}-\d{2}-\d{2}$/.test(from)) {
      fromEl.value = from;
      dateFrom = new Date(from + "T00:00:00");
    }
    if (to && /^\d{4}-\d{2}-\d{2}$/.test(to)) {
      toEl.value = to;
      dateTo = new Date(to + "T23:59:59");
    }
    if (fromEl.value || toEl.value) updatePresetHighlight();
    const loc = p.get("loc");
    if (loc) {
      // setLocationFilter shows the pill and calls render() itself.
      setLocationFilter(loc);
    }
    const q = p.get("q");
    if (q) {
      searchEl.value = q;
      updateSearch();
    }
  }

  copyEl.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      copyEl.textContent = "Copied!";
      copyEl.classList.add("copied");
    } catch {
      copyEl.textContent = "Copy failed";
    }
    setTimeout(() => {
      copyEl.textContent = "Copy link";
      copyEl.classList.remove("copied");
    }, 1500);
  });

  if (events.length === 0) {
    list.innerHTML = '<div class="empty">No upcoming events.</div>';
    meta.textContent = "updated " + generatedAt.toLocaleString();
    return;
  }
  filters.hidden = false;
  readStateFromUrl();
  render();

  function render() {
    writeStateToUrl();
    const otherFiltersPass = (ev) => {
      const evSources = ev.sources || [];
      if (!evSources.some(s => selected.has(s))) return false;
      if (dateFrom && ev._start < dateFrom) return false;
      if (dateTo && ev._start > dateTo) return false;
      if (locationFilter && ev.location !== locationFilter) return false;
      return true;
    };

    let filtered;
    let flat = false;
    if (rankedOrder) {
      // Search-active branch: apply other filters AFTER ranking (spec §1.3),
      // preserving MiniSearch's descending-score order.
      filtered = rankedOrder.map(id => events[id]).filter(otherFiltersPass);
      flat = true;
    } else {
      filtered = events.filter(otherFiltersPass);
    }

    const isFiltered = filtered.length !== events.length;
    meta.textContent = (isFiltered ? filtered.length + " of " + events.length : events.length)
      + " upcoming events · updated " + generatedAt.toLocaleString();

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">No events match the current filters.</div>';
      return;
    }
    list.innerHTML = flat ? renderFlat(filtered) : renderList(filtered);
  }

  // Build one event's card HTML. `timeHtml` is the pre-formatted, already-escaped
  // time string to place in the `.time` slot — callers control whether it's a
  // time-only string ("8:00 PM", grouped view) or a full date+time ("Fri Oct 4 · 8:00 PM",
  // search-active flat view).
  function renderEventRow(ev, timeHtml) {
    const title = escapeHtml(ev.title);
    const titleHtml = ev.url
      ? '<a href="' + escapeHtml(ev.url) + '" target="_blank" rel="noopener">' + title + "</a>"
      : title;
    const loc = ev.location
      ? '<div class="location"><button type="button" class="location-btn" data-location="'
          + escapeHtml(ev.location) + '" title="Filter by this location">'
          + escapeHtml(ev.location) + '</button></div>'
      : "";
    const src = '<div class="source">' + escapeHtml((ev.sources || []).join(" · ")) + "</div>";
    const desc = renderDescription(ev.description);
    // Thumbnail is optional — some sources don't expose one, and we don't
    // want a broken-image slot. Skip the div entirely if no image_url.
    const thumb = ev.image_url
      ? '<div class="thumb"><img loading="lazy" decoding="async" alt="" src="'
          + escapeHtml(ev.image_url) + '"></div>'
      : "";
    return (
      '<div class="event">' +
        '<div class="time">' + timeHtml + "</div>" +
        thumb +
        '<div class="details">' +
          '<div class="title">' + titleHtml + "</div>" +
          loc + src + desc +
        "</div>" +
      "</div>"
    );
  }

  function renderList(events) {
    const timeFmt = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
    const dateFmt = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" });
    const groups = new Map();
    for (const ev of events) {
      const key = ev._start.toDateString();
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(ev);
    }
    const parts = [];
    for (const [key, dayEvents] of groups) {
      parts.push('<h2 class="date">' + escapeHtml(dateFmt.format(new Date(key))) + "</h2>");
      for (const ev of dayEvents) {
        const time = escapeHtml(timeFmt.format(ev._start));
        parts.push(renderEventRow(ev, time));
      }
    }
    return parts.join("");
  }

  // Flat ranked rendering — used when a search query is active. No date
  // headers; each row's `.time` shows the full date + time so the reader
  // always knows *when* the top-of-list result is.
  const flatDateFmt = new Intl.DateTimeFormat(undefined, {
    weekday: "short", month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit",
  });
  function renderFlat(events) {
    const parts = [];
    for (const ev of events) {
      const when = escapeHtml(flatDateFmt.format(ev._start));
      parts.push(renderEventRow(ev, when));
    }
    return parts.join("");
  }
})();

// Pick the first sentence for the preview. Falls back to a hard char cap so a
// single run-on sentence still gets truncated. The `\.\s|\!\s|\?\s` lookahead
// keeps the terminator in the match while requiring real word-boundary
// whitespace so we don't split on abbreviations at end of string.
const PREVIEW_MAX = 180;
function firstSentence(text) {
  const t = text.replace(/\s+/g, " ").trim();
  const m = t.match(/^[^.!?]*[.!?](?=\s|$)/);
  let s = m ? m[0].trim() : t;
  if (s.length > PREVIEW_MAX) s = s.slice(0, PREVIEW_MAX).replace(/\s+\S*$/, "").trim();
  return s;
}
function renderDescription(text) {
  if (!text) return "";
  const full = text.replace(/\s+/g, " ").trim();
  if (!full) return "";
  const preview = firstSentence(full);
  // Nothing to reveal — render as plain (non-interactive) text.
  if (preview.length >= full.length) {
    return '<div class="description">' + escapeHtml(full) + "</div>";
  }
  return (
    '<div class="description" role="button" tabindex="0" aria-label="Expand description">' +
      '<span class="desc-preview">' + escapeHtml(preview) +
        '<span class="desc-toggle">… more</span></span>' +
      '<span class="desc-full">' + escapeHtml(full) +
        ' <span class="desc-toggle">less</span></span>' +
    "</div>"
  );
}

function escapeHtml(s) {
  return s == null ? "" : String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
</script>
</body>
</html>
