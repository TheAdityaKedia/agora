<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agora — SF Events</title>
<style>
  :root {
    --fg: #1a1a1a;
    --muted: #666;
    --accent: #0057b7;
    --accent-fg: #ffffff;
    --bg: #fafaf7;
    --chip-bg: #eeeeea;
    --border: #e5e5e5;
    --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e8e8e8; --muted: #999; --accent: #7ab7ff; --accent-fg: #0a1a2a;
      --bg: #111; --chip-bg: #222; --border: #2a2a2a; --input-bg: #1a1a1a;
    }
  }
  * { box-sizing: border-box; }
  /* Ensure the hidden attribute wins over `display: flex` set on filter rows. */
  [hidden] { display: none !important; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--fg); background: var(--bg);
    max-width: 720px; margin: 0 auto; padding: 24px;
    line-height: 1.5;
  }
  header { margin-bottom: 20px; }
  h1 { margin: 0; font-size: 32px; letter-spacing: -0.02em; }
  .subtitle { color: var(--muted); margin-top: 4px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 12px; }

  .filters {
    display: flex; flex-direction: column; gap: 12px;
    padding: 12px 0 4px;
    margin-bottom: 8px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .filter-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 6px 0;
  }
  .filter-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 600;
    flex: 0 0 60px;
  }
  .dropdown { position: relative; }
  .dropdown > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--chip-bg); color: var(--fg);
    font-size: 13px; border: 1px solid var(--border);
  }
  .dropdown > summary::-webkit-details-marker { display: none; }
  .dropdown > summary::after {
    content: "▾"; font-size: 10px; opacity: 0.6;
  }
  .dropdown[open] > summary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .dropdown-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 10;
    min-width: 240px;
    background: var(--input-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; display: flex; flex-direction: column; gap: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  .dropdown-bulk {
    display: flex; gap: 6px; padding: 4px 4px 8px;
    border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }
  .dropdown-bulk button {
    padding: 3px 8px; border-radius: 6px;
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    font-size: 12px; cursor: pointer;
  }
  .dropdown-bulk button:hover { color: var(--fg); }
  .dropdown-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 6px; border-radius: 6px; cursor: pointer;
    font-size: 13px;
  }
  .dropdown-item:hover { background: var(--chip-bg); }
  .dropdown-item .count {
    margin-left: auto; font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .date-input {
    padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--input-bg); color: var(--fg); font: inherit; font-size: 13px;
    color-scheme: light dark;
  }
  .reset-btn {
    padding: 4px 10px; border-radius: 999px;
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    font-size: 13px; cursor: pointer;
    margin-left: auto;
  }
  .reset-btn:hover { color: var(--fg); }

  h2.date {
    margin: 32px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 600;
  }
  .event { display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .event:last-child { border-bottom: none; }
  .time {
    flex: 0 0 72px; color: var(--muted); font-variant-numeric: tabular-nums;
    font-size: 14px; padding-top: 2px;
  }
  .details { flex: 1; min-width: 0; }
  .title a { color: var(--fg); font-weight: 600; text-decoration: none; }
  .title a:hover { color: var(--accent); text-decoration: underline; }
  .location, .source { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .location-btn {
    background: none; border: none; padding: 0; margin: 0;
    color: inherit; font: inherit; text-align: left;
    cursor: pointer; text-decoration: none;
  }
  .location-btn:hover { color: var(--fg); text-decoration: underline; }
  .active-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 4px 3px 10px; border-radius: 999px;
    background: var(--accent); color: var(--accent-fg);
    font-size: 13px; border: 1px solid var(--accent);
    max-width: 100%; min-width: 0;
  }
  .active-pill .pill-label {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .active-pill .pill-clear {
    background: transparent; border: 0; color: inherit; cursor: pointer;
    padding: 0 4px; font-size: 14px; line-height: 1;
    border-radius: 999px;
  }
  .active-pill .pill-clear:hover { background: rgba(255,255,255,0.2); }
  .empty, .error { color: var(--muted); text-align: center; padding: 48px 0; }
  .error { color: #c33; }
</style>
</head>
<body>
<header>
  <h1>Agora</h1>
  <div class="subtitle">SF events, one calendar.</div>
  <div class="meta" id="meta"></div>
</header>

<section class="filters" id="filters" hidden>
  <div class="filter-row">
    <span class="filter-label">Sources</span>
    <details class="dropdown" id="source-dropdown">
      <summary id="source-summary">Loading…</summary>
      <div class="dropdown-panel">
        <div class="dropdown-bulk">
          <button type="button" id="select-all">Select all</button>
          <button type="button" id="deselect-all">Deselect all</button>
        </div>
        <div id="source-list"></div>
      </div>
    </details>
  </div>
  <div class="filter-row" id="location-row" hidden>
    <span class="filter-label">Location</span>
    <span class="active-pill" id="location-pill">
      <span class="pill-label" id="location-label"></span>
      <button type="button" class="pill-clear" id="location-clear" aria-label="Clear location filter">×</button>
    </span>
  </div>
  <div class="filter-row">
    <span class="filter-label">Dates</span>
    <label style="font-size:13px;color:var(--muted)">From
      <input type="date" id="date-from" class="date-input" aria-label="From date">
    </label>
    <label style="font-size:13px;color:var(--muted)">To
      <input type="date" id="date-to" class="date-input" aria-label="To date">
    </label>
    <button id="reset" class="reset-btn">Reset filters</button>
  </div>
</section>

<main id="list"><div class="empty">Loading…</div></main>

<script>
(async () => {
  const list = document.getElementById("list");
  const meta = document.getElementById("meta");
  const filters = document.getElementById("filters");
  const sourceListEl = document.getElementById("source-list");
  const summaryEl = document.getElementById("source-summary");
  const selectAllEl = document.getElementById("select-all");
  const deselectAllEl = document.getElementById("deselect-all");
  const fromEl = document.getElementById("date-from");
  const toEl = document.getElementById("date-to");
  const resetEl = document.getElementById("reset");
  const locationRowEl = document.getElementById("location-row");
  const locationLabelEl = document.getElementById("location-label");
  const locationClearEl = document.getElementById("location-clear");

  let data;
  try {
    const resp = await fetch("./events.json", { cache: "no-cache" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    data = await resp.json();
  } catch (e) {
    list.innerHTML = '<div class="error">Couldn’t load events.json — ' + escapeHtml(e.message) + "</div>";
    return;
  }

  const events = (data.events || []).map(e => ({...e, _start: new Date(e.start_time)}));
  const generatedAt = new Date(data.generated_at);

  // State — events carry a `sources` list (a physical event may be listed by
  // multiple sources), so counts and filtering consider every entry in that list.
  const allSources = [...new Set(events.flatMap(e => e.sources || []))].sort();
  const selected = new Set(allSources);  // all on by default
  let dateFrom = null;
  let dateTo = null;
  let locationFilter = null;

  function setLocationFilter(loc) {
    locationFilter = loc;
    if (loc) {
      locationLabelEl.textContent = loc;
      locationRowEl.hidden = false;
    } else {
      locationRowEl.hidden = true;
    }
    render();
  }
  locationClearEl.addEventListener("click", () => setLocationFilter(null));
  // Event delegation: any .location-btn click sets the filter to its data-location.
  list.addEventListener("click", (e) => {
    const btn = e.target.closest(".location-btn");
    if (btn) setLocationFilter(btn.dataset.location);
  });

  // Build source list (checkbox rows, with per-source counts). A multi-source
  // event counts toward each of its sources.
  const sourceCounts = new Map();
  for (const s of allSources) {
    sourceCounts.set(s, events.filter(e => (e.sources || []).includes(s)).length);
  }
  const checkboxes = new Map();  // source -> input element
  for (const s of allSources) {
    const label = document.createElement("label");
    label.className = "dropdown-item";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = true; cb.dataset.source = s;
    cb.addEventListener("change", () => {
      if (cb.checked) selected.add(s); else selected.delete(s);
      updateSourceSummary();
      render();
    });
    checkboxes.set(s, cb);
    label.appendChild(cb);
    const name = document.createElement("span");
    name.textContent = s;
    label.appendChild(name);
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = sourceCounts.get(s);
    label.appendChild(count);
    sourceListEl.appendChild(label);
  }

  selectAllEl.addEventListener("click", () => {
    for (const s of allSources) { selected.add(s); checkboxes.get(s).checked = true; }
    updateSourceSummary();
    render();
  });
  deselectAllEl.addEventListener("click", () => {
    selected.clear();
    for (const cb of checkboxes.values()) cb.checked = false;
    updateSourceSummary();
    render();
  });

  function updateSourceSummary() {
    const n = selected.size, total = allSources.length;
    if (n === total) summaryEl.textContent = "All sources (" + total + ")";
    else if (n === 0) summaryEl.textContent = "No sources";
    else if (n === 1) summaryEl.textContent = [...selected][0];
    else summaryEl.textContent = n + " of " + total + " sources";
  }
  updateSourceSummary();

  fromEl.addEventListener("input", () => { dateFrom = fromEl.value ? new Date(fromEl.value + "T00:00:00") : null; render(); });
  toEl.addEventListener("input",   () => { dateTo   = toEl.value   ? new Date(toEl.value   + "T23:59:59") : null; render(); });
  resetEl.addEventListener("click", () => {
    for (const s of allSources) { selected.add(s); checkboxes.get(s).checked = true; }
    updateSourceSummary();
    fromEl.value = ""; toEl.value = ""; dateFrom = dateTo = null;
    setLocationFilter(null);
  });

  if (events.length === 0) {
    list.innerHTML = '<div class="empty">No upcoming events.</div>';
    meta.textContent = "updated " + generatedAt.toLocaleString();
    return;
  }
  filters.hidden = false;
  render();

  function render() {
    const filtered = events.filter(ev => {
      const evSources = ev.sources || [];
      // Include this event if any of its sources is currently selected.
      if (!evSources.some(s => selected.has(s))) return false;
      if (dateFrom && ev._start < dateFrom) return false;
      if (dateTo && ev._start > dateTo) return false;
      if (locationFilter && ev.location !== locationFilter) return false;
      return true;
    });

    const isFiltered = filtered.length !== events.length;
    meta.textContent = (isFiltered ? filtered.length + " of " + events.length : events.length)
      + " upcoming events · updated " + generatedAt.toLocaleString();

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">No events match the current filters.</div>';
      return;
    }
    list.innerHTML = renderList(filtered);
  }

  function renderList(events) {
    const timeFmt = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
    const dateFmt = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" });
    const groups = new Map();
    for (const ev of events) {
      const key = ev._start.toDateString();
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(ev);
    }
    const parts = [];
    for (const [key, dayEvents] of groups) {
      parts.push('<h2 class="date">' + escapeHtml(dateFmt.format(new Date(key))) + "</h2>");
      for (const ev of dayEvents) {
        const time = escapeHtml(timeFmt.format(ev._start));
        const title = escapeHtml(ev.title);
        const titleHtml = ev.url
          ? '<a href="' + escapeHtml(ev.url) + '" target="_blank" rel="noopener">' + title + "</a>"
          : title;
        const loc = ev.location
          ? '<div class="location"><button type="button" class="location-btn" data-location="'
              + escapeHtml(ev.location) + '" title="Filter by this location">'
              + escapeHtml(ev.location) + '</button></div>'
          : "";
        const src = '<div class="source">' + escapeHtml((ev.sources || []).join(" · ")) + "</div>";
        parts.push(
          '<div class="event">' +
            '<div class="time">' + time + "</div>" +
            '<div class="details">' +
              '<div class="title">' + titleHtml + "</div>" +
              loc + src +
            "</div>" +
          "</div>"
        );
      }
    }
    return parts.join("");
  }
})();

function escapeHtml(s) {
  return s == null ? "" : String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
</script>
</body>
</html>
