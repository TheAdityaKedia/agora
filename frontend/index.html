<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agora — Bay Area events</title>
<meta name="description" content="Concerts, readings, screenings, talks and more around the Bay, in one calendar.">
<meta name="theme-color" content="#eef1f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1822" media="(prefers-color-scheme: dark)">
<link rel="preload" href="./vendor/fonts/big-shoulders-display-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Self-hosted (SIL OFL; licenses alongside). Latin subsets: other scripts
     fall back to the system font via unicode-range. */
  @font-face {
    font-family: "Big Shoulders Display"; font-style: normal; font-weight: 100 900;
    font-display: swap;
    src: url(./vendor/fonts/big-shoulders-display-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Instrument Sans"; font-style: normal; font-weight: 400 700;
    font-display: swap;
    src: url(./vendor/fonts/instrument-sans-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  /* Palette: Bay fog, bay-navy ink, and International Orange (the Golden
     Gate's paint) as the one accent. Times and day headings are set in a
     condensed signage face, like a marquee; everything else stays quiet. */
  :root {
    --font-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
    --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --fg: #13212e;
    --muted: #55646e;
    --accent: #c0362c;
    --accent-fg: #ffffff;
    --bg: #eef1f2;
    --chip-bg: #dfe5e8;
    --border: #d2dade;
    --input-bg: #fafbfb;
    --error: #a3281f;
    --sheet-shadow: 0 -8px 32px rgba(19,33,46,0.22);
    /* Height of the sticky search bar; set from JS so day headings stick below it. */
    --sticky-top: 0px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e4e9ec; --muted: #93a3ae; --accent: #f26b4a; --accent-fg: #0e1822;
      --bg: #0e1822; --chip-bg: #1b2a37; --border: #243644; --input-bg: #15222e;
      --error: #ff8a75; --sheet-shadow: 0 -8px 32px rgba(0,0,0,0.5);
    }
  }
  * { box-sizing: border-box; }
  /* Ensure the hidden attribute wins over `display: flex` set on filter rows. */
  [hidden] { display: none !important; }
  body {
    font-family: var(--font-body);
    color: var(--fg); background: var(--bg);
    max-width: 720px; margin: 0 auto; padding: 0 16px 48px;
    line-height: 1.5;
  }
  body.sheet-open { overflow: hidden; }
  button { font: inherit; }
  header.masthead { padding: 20px 0 6px; }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 800;
    font-size: 46px; line-height: 0.9; letter-spacing: 0.01em;
  }
  .subtitle { color: var(--muted); margin-top: 6px; }

  /* --- Sticky search bar: search + Filters button, then date presets. --- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    padding: 8px 0;
  }
  .search-line { display: flex; gap: 8px; }
  #search-input {
    flex: 1; min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--input-bg); color: var(--fg);
    font: inherit; font-size: 16px;  /* 16px keeps iOS from zooming on focus */
    outline: none;
  }
  #search-input:focus { border-color: var(--accent); }
  .filters-btn {
    flex: 0 0 auto;
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
    background: var(--input-bg); color: var(--fg); border: 1px solid var(--border);
  }
  .filters-btn .badge {
    display: inline-block; min-width: 1.5em; margin-left: 4px; padding: 0 5px;
    border-radius: 999px; background: var(--accent); color: var(--accent-fg);
    font-size: 12px; text-align: center;
  }
  /* Presets scroll sideways on a phone instead of wrapping onto three lines. */
  .presets {
    display: flex; gap: 8px; margin-top: 8px;
    overflow-x: auto; scrollbar-width: none;
  }
  .presets::-webkit-scrollbar { display: none; }
  .preset-btn {
    flex: 0 0 auto;
    padding: 4px 12px; border-radius: 999px;
    background: var(--chip-bg); color: var(--fg); border: 1px solid var(--border);
    font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--accent); }
  .preset-btn.active {
    background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
  }

  /* --- Filters: a bottom sheet on phones (opened by the Filters button). --- */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(0,0,0,0.35);
  }
  .filters {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
    max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--bg);
    border-radius: 16px 16px 0 0; box-shadow: var(--sheet-shadow);
    padding: 0 16px 16px;
    transform: translateY(105%); visibility: hidden;
    transition: transform 0.22s ease-out, visibility 0s linear 0.22s;
  }
  .filters.open {
    transform: none; visibility: visible;
    transition: transform 0.22s ease-out;
  }
  @media (prefers-reduced-motion: reduce) {
    .filters, .filters.open { transition: none; }
  }
  .sheet-head {
    position: sticky; top: 0; z-index: 1; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0 10px; border-bottom: 1px solid var(--border);
  }
  .sheet-head h2 { margin: 0; font-size: 18px; }
  .sheet-foot {
    position: sticky; bottom: -16px; background: var(--bg);
    padding: 12px 0 16px; margin-top: 8px; border-top: 1px solid var(--border);
  }
  .done-btn {
    width: 100%; padding: 12px; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: var(--accent-fg); border: 0;
    font-weight: 600;
  }
  .filter-group { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .filter-group.last { border-bottom: 0; }
  .filter-group > h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
  .filter-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .date-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .date-fields label { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); min-width: 0; }
  .date-fields .date-input { width: 100%; min-width: 0; }

  /* Sources / Topics: disclosure lists that expand in place. */
  .dropdown > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--chip-bg); color: var(--fg);
    font-size: 14px; border: 1px solid var(--border);
  }
  .dropdown > summary::-webkit-details-marker { display: none; }
  .dropdown > summary::after { content: "▾"; font-size: 10px; opacity: 0.6; }
  .dropdown[open] > summary::after { content: "▴"; }
  .dropdown-panel {
    margin-top: 8px;
    background: var(--input-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; display: flex; flex-direction: column; gap: 4px;
  }
  .dropdown-scroll { overflow-y: auto; max-height: 50vh; }
  .dropdown-empty { padding: 12px; color: var(--muted); font-size: 13px; text-align: center; }
  .dropdown-search { padding: 4px 4px 8px; }
  .dropdown-search input {
    width: 100%;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit; font-size: 16px;
    outline: none;
  }
  .dropdown-search input:focus { border-color: var(--accent); }
  .dropdown-bulk {
    display: flex; gap: 6px; padding: 4px 4px 8px;
    border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }
  .dropdown-bulk button, .reset-btn, .copy-btn {
    padding: 4px 10px; border-radius: 999px;
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    font-size: 13px; cursor: pointer;
  }
  .dropdown-bulk button:hover, .reset-btn:hover { color: var(--fg); }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
  .copy-btn.copied { color: var(--accent-fg); background: var(--accent); border-color: var(--accent); }
  .dropdown-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 6px; border-radius: 6px; cursor: pointer;
    font-size: 14px; overflow-wrap: anywhere;
  }
  .dropdown-item:hover { background: var(--chip-bg); }
  .dropdown-item .count {
    margin-left: 6px; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: right;
  }
  /* "Only" isolate affordance — reserved space (visibility, not display) so
     the count doesn't shift on hover; revealed when hovering the row. */
  .dropdown-item .only-btn {
    margin-left: auto; font: inherit; font-size: 12px; line-height: 1.4;
    padding: 0 6px; border-radius: 5px; cursor: pointer;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    visibility: hidden;
  }
  .dropdown-item:hover .only-btn, .dropdown-item:focus-within .only-btn { visibility: visible; }
  .dropdown-item .only-btn:hover { color: var(--accent); border-color: var(--accent); }
  /* Touch screens have no hover, so "Only" must always be showing there. */
  @media (hover: none) { .dropdown-item .only-btn { visibility: visible; } }
  .date-input {
    padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--input-bg); color: var(--fg); font: inherit; font-size: 16px;
    color-scheme: light dark;
  }

  /* --- Above the list: active-filter pills, counts, day strip. --- */
  .active-filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 0; }
  .active-filters:empty { display: none; }
  .active-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 4px 3px 10px; border-radius: 999px;
    background: var(--accent); color: var(--accent-fg);
    font-size: 13px; border: 1px solid var(--accent);
    max-width: 100%; min-width: 0;
  }
  .active-pill .pill-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .active-pill .pill-clear {
    background: transparent; border: 0; color: inherit; cursor: pointer;
    padding: 0 6px; font-size: 16px; line-height: 1;
    border-radius: 999px;
  }
  .active-pill .pill-clear:hover { background: rgba(255,255,255,0.2); }
  .meta { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .day-strip {
    display: flex; gap: 6px; margin: 10px 0 0; padding-bottom: 4px;
    overflow-x: auto; scrollbar-width: thin;
  }
  .day-btn {
    flex: 0 0 auto; cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    min-width: 46px; padding: 4px 6px; border-radius: 8px;
    background: transparent; color: var(--fg); border: 1px solid var(--border);
    line-height: 1.15;
  }
  .day-btn .dow { font-size: 11px; color: var(--muted); }
  .day-btn .dom { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1; }
  .day-btn:hover { border-color: var(--accent); }

  /* --- Event list --- */
  h2.date {
    margin: 28px 0 4px;
    padding: 8px 0 6px;
    border-bottom: 2px solid var(--fg);
    font-family: var(--font-display); font-size: 28px; line-height: 1.05;
    letter-spacing: 0.01em; color: var(--fg); font-weight: 800;
    /* Stick just below the search bar so the day you're viewing stays visible. */
    position: sticky; top: var(--sticky-top); background: var(--bg); z-index: 5;
    scroll-margin-top: var(--sticky-top);
  }
  /* Phone: time on its own line, then the title at full width, with the
     thumbnail to the right. Wider screens put the time in its own column. */
  .event {
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    column-gap: 12px;
    padding: 14px 0; border-bottom: 1px solid var(--border);
  }
  .day .event:last-of-type { border-bottom: none; }
  .day-more {
    display: block; width: 100%; margin: 4px 0 8px; padding: 10px 14px;
    border-radius: 8px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--border); font-weight: 600;
  }
  .day-more:hover { border-color: var(--accent); }
  .event.no-thumb { grid-template-columns: minmax(0, 1fr); }
  /* The marquee: times in the signage face, read before anything else. */
  .time {
    grid-column: 1; color: var(--fg);
    font-family: var(--font-display); font-weight: 700;
    font-size: 22px; line-height: 1.1; letter-spacing: 0.01em;
  }
  .time .ampm { font-size: 0.6em; margin-left: 0.15em; color: var(--muted); }
  .time .td-date {
    font-family: var(--font-body); font-size: 14px; font-weight: 600;
    color: var(--muted); margin-right: 8px; letter-spacing: 0;
  }
  .thumb {
    grid-column: 2; grid-row: 1 / span 2;
    width: 64px; height: 64px;
    border-radius: 6px; background: var(--chip-bg);
    overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* overflow-wrap: long URLs and slash-joined titles otherwise widen the page
     past a phone screen (it then zooms out or scrolls sideways). */
  .details { grid-column: 1; min-width: 0; overflow-wrap: anywhere; }
  .title { font-size: 17px; line-height: 1.3; margin-top: 4px; }
  .title a { color: var(--fg); font-weight: 600; text-decoration: none; }
  .title a:hover { color: var(--accent); text-decoration: underline; }
  .where { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .where .source { display: block; font-size: 13px; }
  .where .source::before { content: "Listed by "; }
  .description {
    font-size: 14px; color: var(--muted);
    margin-top: 6px; line-height: 1.45;
  }
  .description[role="button"] { cursor: pointer; }
  .description[role="button"]:hover { color: var(--fg); }
  .description[role="button"]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px;
  }
  .description .desc-full { display: none; white-space: pre-wrap; }
  .description.expanded .desc-preview { display: none; }
  .description.expanded .desc-full { display: inline; }
  .desc-toggle { color: var(--accent); font-weight: 500; margin-left: 2px; }
  .location-btn, .source-btn {
    background: none; border: none; padding: 0; margin: 0;
    color: inherit; font: inherit; text-align: left;
    cursor: pointer; text-decoration: none;
  }
  .location-btn:hover, .source-btn:hover { color: var(--fg); text-decoration: underline; }
  @media (min-width: 600px) {
    .event, .event.no-thumb { grid-template-columns: 88px minmax(0, 1fr) 80px; column-gap: 16px; }
    .time { grid-column: 1; grid-row: 1 / span 2; font-size: 32px; line-height: 0.95; }
    .time .ampm { display: block; margin: 2px 0 0; font-size: 14px; }
    .time .td-date { display: block; margin: 0 0 2px; }
    .title { margin-top: 0; }
    .details { grid-column: 2; grid-row: 1 / span 2; }
    .thumb { grid-column: 3; width: 80px; height: 80px; }
    body.searching .event { grid-template-columns: 120px minmax(0, 1fr) 80px; }
  }

  /* --- Tag chips (type + topic), colored by axis/group via a per-chip hue.
     One --h drives text/border/bg; lightness flips by theme so chips read on
     both backgrounds. --- */
  :root { --chip-s: 50%; --chip-l: 34%; }
  @media (prefers-color-scheme: dark) { :root { --chip-s: 52%; --chip-l: 72%; } }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag-chip {
    font: inherit; font-size: 12px; line-height: 1.4;
    padding: 2px 9px; border-radius: 999px; cursor: pointer;
    color: hsl(var(--h) var(--chip-s) var(--chip-l));
    border: 1px solid hsl(var(--h) var(--chip-s) var(--chip-l) / 0.40);
    background: hsl(var(--h) var(--chip-s) var(--chip-l) / 0.10);
    max-width: 100%;
  }
  .tag-chip:hover { background: hsl(var(--h) var(--chip-s) var(--chip-l) / 0.20); }
  .tag-chip.on {
    color: var(--accent-fg);
    background: hsl(var(--h) var(--chip-s) var(--chip-l));
    border-color: hsl(var(--h) var(--chip-s) var(--chip-l));
  }
  /* Topic dropdown: grouped list with a color swatch per group. */
  .dropdown-group-item { margin-top: 4px; }
  .dropdown-group-label { color: var(--fg); font-weight: 700; }
  /* Indent child topic rows under their group header. */
  .dropdown-item[data-topic] { padding-left: 20px; }
  .topic-swatch {
    width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto;
    background: hsl(var(--h) var(--chip-s) var(--chip-l));
  }
  /* Finger-sized targets on touch screens. */
  @media (pointer: coarse) {
    .tag-chip { font-size: 13px; padding: 4px 10px; }
    .preset-btn { padding: 7px 14px; }
    .dropdown-bulk button, .reset-btn, .copy-btn { padding: 8px 14px; }
    .dropdown > summary { padding: 8px 14px; }
    .dropdown-item { padding: 10px 6px; }
    .dropdown-item .only-btn { padding: 4px 10px; }
  }

  /* --- Wide screens: the filter panel is a sticky sidebar, not a sheet. --- */
  @media (min-width: 1024px) {
    body {
      max-width: 1120px; padding: 0 32px 64px;
      display: grid; grid-template-columns: 260px minmax(0, 1fr);
      column-gap: 48px; align-items: start;
    }
    header.masthead { grid-column: 1 / -1; padding: 32px 0 16px; }
    h1 { font-size: 64px; }
    .topbar { grid-column: 2; grid-row: 2; }
    main { grid-column: 2; grid-row: 3; }
    .filters, .filters.open {
      grid-column: 1; grid-row: 2 / span 2;
      position: sticky; top: 0; z-index: auto;
      max-height: 100vh; overflow-y: auto;
      transform: none; visibility: visible; transition: none;
      border-radius: 0; box-shadow: none; padding: 0 4px 24px 0;
      background: transparent;
    }
    .sheet-head { background: var(--bg); padding-top: 8px; }
    .filters-btn, .sheet-foot, .sheet-backdrop { display: none !important; }
    body.sheet-open { overflow: visible; }
    .dropdown-scroll { max-height: 40vh; }
    .date-fields { grid-template-columns: 1fr; }
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #search-input:focus-visible, .dropdown-search input:focus-visible { outline: none; }
  kbd {
    font: inherit; font-size: 12px; padding: 0 5px;
    border: 1px solid var(--border); border-radius: 4px; color: var(--muted);
  }
  .shortcut-hint { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  @media (pointer: coarse) { .shortcut-hint { display: none; } }
  .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; }

  .empty, .error { color: var(--muted); text-align: center; padding: 48px 0; }
  .error { color: var(--error); }
  /* Placeholder rows while events.json downloads and parses. */
  .skeleton { padding: 24px 0; }
  .skeleton-row { display: flex; gap: 16px; padding: 14px 0; }
  .skeleton-row span { background: var(--chip-bg); border-radius: 6px; height: 14px; }
  .skeleton-row .s-time { flex: 0 0 60px; }
  .skeleton-row .s-body { flex: 1; height: 48px; }
  .loading-note { color: var(--muted); font-size: 14px; }
  .sentinel { height: 1px; }
</style>
</head>
<body>
<header class="masthead">
  <h1>Agora</h1>
  <div class="subtitle">Events around the Bay, in one calendar.</div>
</header>

<div class="topbar" id="topbar">
  <div class="search-line">
    <input type="search" id="search-input" placeholder="Search events, venues, topics" aria-label="Search events" autocomplete="off" enterkeyhint="search">
    <button type="button" class="filters-btn" id="filters-btn" aria-controls="filters" aria-expanded="false">Filters<span class="badge" id="filters-count" hidden></span></button>
  </div>
  <div class="presets" role="group" aria-label="Dates">
    <button type="button" class="preset-btn" id="preset-today">Today</button>
    <button type="button" class="preset-btn" id="preset-tomorrow">Tomorrow</button>
    <button type="button" class="preset-btn" id="preset-weekend">This weekend</button>
    <button type="button" class="preset-btn" id="preset-week">This week</button>
    <button type="button" class="preset-btn" id="preset-month">This month</button>
  </div>
</div>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<aside class="filters" id="filters" aria-label="Filters" hidden>
  <div class="sheet-head">
    <h2>Filters</h2>
    <button type="button" class="reset-btn" id="reset">Reset all</button>
  </div>
  <div class="filter-group">
    <h3>Dates</h3>
    <div class="date-fields">
      <label>From <input type="date" id="date-from" class="date-input"></label>
      <label>To <input type="date" id="date-to" class="date-input"></label>
    </div>
  </div>
  <div class="filter-group">
    <h3>Type</h3>
    <div class="chip-row" id="type-chips"></div>
  </div>
  <div class="filter-group">
    <h3>Topics</h3>
    <details class="dropdown" id="topic-dropdown">
      <summary id="topic-summary">Any topic</summary>
      <div class="dropdown-panel">
        <div class="dropdown-search">
          <input type="search" id="topic-search" placeholder="Search topics" aria-label="Search topics" autocomplete="off">
        </div>
        <div class="dropdown-bulk">
          <button type="button" id="topic-select-all">Select all</button>
          <button type="button" id="topic-deselect-all">Deselect all</button>
        </div>
        <div class="dropdown-scroll">
          <div id="topic-list"></div>
          <div class="dropdown-empty" id="topic-empty" hidden>No topics match.</div>
        </div>
      </div>
    </details>
  </div>
  <div class="filter-group">
    <h3>Venues and organizers</h3>
    <details class="dropdown" id="source-dropdown">
      <summary id="source-summary">Loading…</summary>
      <div class="dropdown-panel">
        <div class="dropdown-search">
          <input type="search" id="source-search" placeholder="Search venues" aria-label="Search venues and organizers" autocomplete="off">
        </div>
        <div class="dropdown-bulk">
          <button type="button" id="select-all">Select all</button>
          <button type="button" id="deselect-all">Deselect all</button>
        </div>
        <div class="dropdown-scroll">
          <div id="source-list"></div>
          <div class="dropdown-empty" id="source-empty" hidden>No venues match.</div>
        </div>
      </div>
    </details>
  </div>
  <div class="filter-group last">
    <div class="filter-actions">
      <button id="copy-link" class="copy-btn" type="button">Copy link to this view</button>
    </div>
    <p class="shortcut-hint" id="shortcut-hint">Press <kbd>/</kbd> to search.</p>
  </div>
  <div class="sheet-foot">
    <button type="button" class="done-btn" id="filters-done">Show events</button>
  </div>
</aside>

<main>
  <div class="active-filters" id="active-filters"></div>
  <div class="meta" id="meta"></div>
  <nav class="day-strip" id="day-strip" aria-label="Jump to a day" hidden></nav>
  <div id="list">
    <div class="skeleton" aria-busy="true">
      <p class="loading-note">Loading events…</p>
      <div class="skeleton-row"><span class="s-time"></span><span class="s-body"></span></div>
      <div class="skeleton-row"><span class="s-time"></span><span class="s-body"></span></div>
      <div class="skeleton-row"><span class="s-time"></span><span class="s-body"></span></div>
    </div>
  </div>
</main>

<script src="./vendor/minisearch-6.3.0.min.js"></script>
<script>
(async () => {
  const list = document.getElementById("list");
  const meta = document.getElementById("meta");
  const filters = document.getElementById("filters");
  const sourceListEl = document.getElementById("source-list");
  const sourceEmptyEl = document.getElementById("source-empty");
  const sourceSearchEl = document.getElementById("source-search");
  const summaryEl = document.getElementById("source-summary");
  const selectAllEl = document.getElementById("select-all");
  const deselectAllEl = document.getElementById("deselect-all");
  const fromEl = document.getElementById("date-from");
  const toEl = document.getElementById("date-to");
  const resetEl = document.getElementById("reset");
  const copyEl = document.getElementById("copy-link");
  const presetTodayEl = document.getElementById("preset-today");
  const presetTomorrowEl = document.getElementById("preset-tomorrow");
  const presetWeekendEl = document.getElementById("preset-weekend");
  const presetWeekEl = document.getElementById("preset-week");
  const presetMonthEl = document.getElementById("preset-month");
  const topbarEl = document.getElementById("topbar");
  const filtersBtnEl = document.getElementById("filters-btn");
  const filtersCountEl = document.getElementById("filters-count");
  const filtersDoneEl = document.getElementById("filters-done");
  const backdropEl = document.getElementById("sheet-backdrop");
  const activeFiltersEl = document.getElementById("active-filters");
  const dayStripEl = document.getElementById("day-strip");
  const sourceDropdownEl = document.getElementById("source-dropdown");
  const searchEl = document.getElementById("search-input");

  let data;
  try {
    const resp = await fetch("./events.json", { cache: "no-cache" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    data = await resp.json();
  } catch (e) {
    list.innerHTML = '<div class="error">Events didn’t load (' + escapeHtml(e.message)
      + "). Check your connection and reload the page.</div>";
    return;
  }

  // --- Tag axes (type + topic), from the manifest's taxonomy block. ---
  // Built before the search index so each event's tag labels can be indexed
  // (searching "theater" should surface theater-tagged events even when the
  // word isn't in the title/description). Fixed hue per axis/group so chip
  // colors are stable and scannable.
  const GROUP_HUE = {
    type: 215, Literary: 270, Music: 350, "Theater / Stage": 25, Screen: 190,
    "Art & design": 160, Ideas: 130, Life: 320, "Dance styles": 45,
    Communities: 290, Nightlife: 95,
  };
  const taxonomy = data.taxonomy || {axes: {type: {tree: {}}, topic: {values: {}}}};
  // Flatten the type tree into path→label (dot-joined path, e.g. "talk.reading").
  const typeLabels = new Map();
  (function walkTypes(node, prefix) {
    for (const [slug, child] of Object.entries(node || {})) {
      const path = prefix ? prefix + "." + slug : slug;
      typeLabels.set(path, child.label || slug);
      if (child.children) walkTypes(child.children, path);
    }
  })(taxonomy.axes?.type?.tree, "");
  // topic slug → {label, group}
  const topicMeta = new Map(
    Object.entries(taxonomy.axes?.topic?.values || {})
      .map(([slug, v]) => [slug, {label: v.label || slug, group: v.group || ""}])
  );
  const topicHue = (slug) => GROUP_HUE[topicMeta.get(slug)?.group] ?? 0;
  // An event's types are arrays of path-segments; join to dot-paths for matching.
  const evTypePaths = (ev) => (ev.types || []).map(p => p.join("."));

  // Searchable text for an event's tags: type labels (each ancestor level),
  // topic labels, and topic group names — so "theater", "music", "workshop"
  // all match via search, not just the tag controls.
  function tagsText(e) {
    const words = [];
    for (const path of e.types || []) {
      for (let i = 1; i <= path.length; i++) {
        const label = typeLabels.get(path.slice(0, i).join("."));
        if (label) words.push(label);
      }
    }
    for (const slug of e.topics || []) {
      const m = topicMeta.get(slug);
      if (m) { words.push(m.label); if (m.group) words.push(m.group); }
    }
    return words.join(" ");
  }

  // Never show events that have already started. The manifest is pruned by
  // calendar day, so it still carries today's earlier events; drop them here
  // (before indexing, so counts and search agree) and again at each render
  // for a page left open.
  const loadedAt = Date.now();
  const events = (data.events || [])
    .filter(e => !(new Date(e.start_time) < loadedAt))
    .map((e, i) => ({
      ...e,
      _start: new Date(e.start_time),
      id: i,
      sources_text: (e.sources || []).join(" "),
      tags_text: tagsText(e),
    }));

  // The search index. Indexing ~5k descriptions blocks a phone for seconds,
  // so it's filled in chunks after the first render (buildIndex), not here.
  const miniSearch = new MiniSearch({
    fields: ["title", "description", "location", "sources_text", "tags_text"],
    storeFields: ["id"],
    searchOptions: {
      boost: {title: 3, tags_text: 2, description: 1, location: 1, sources_text: 1},
      prefix: true,
      fuzzy: 0.2,
      combineWith: "AND",
    },
  });
  let indexReady = null;
  let indexed = false;
  function buildIndex() {
    if (!indexReady) {
      indexReady = miniSearch.addAllAsync(events, {chunkSize: 250})
        .then(() => { indexed = true; });
    }
    return indexReady;
  }

  const generatedAt = new Date(data.generated_at);
  // "Updated 3 hours ago", with the exact time on hover.
  const updatedHtml = (() => {
    const mins = Math.round((Date.now() - generatedAt) / 60000);
    if (!isFinite(mins)) return "";
    const rtf = new Intl.RelativeTimeFormat(undefined, {numeric: "auto"});
    const ago = mins < 60 ? rtf.format(-mins, "minute")
      : mins < 48 * 60 ? rtf.format(-Math.round(mins / 60), "hour")
      : rtf.format(-Math.round(mins / 1440), "day");
    return '<span title="' + escapeHtml(generatedAt.toLocaleString()) + '">Updated '
      + escapeHtml(ago) + "</span>";
  })();

  // State — events carry a `sources` list (a physical event may be listed by
  // multiple sources), so counts and filtering consider every entry in that list.
  // Sources in the manifest are already human-readable names — the backend
  // translated them at export time — so alphabetical sort is the natural order.
  const allSources = [...new Set(events.flatMap(e => e.sources || []))].sort(
    (a, b) => a.localeCompare(b)
  );
  const selected = new Set(allSources);  // all on by default
  let dateFrom = null;
  let dateTo = null;
  let locationFilter = null;

  const selectedTypes = new Set();   // dot-paths, e.g. "talk" or "talk.reading"
  // Topics use the same model as Sources: all selected by default, deselect to
  // narrow. (Untagged events always pass the topic filter — see render.)
  const allTopics = [...topicMeta.keys()];
  const selectedTopics = new Set(allTopics);

  // --- Tag filter controls: Type (inline chips, top-levels) + Topic (grouped
  // dropdown). Populated once; `updateTagControls` syncs their active state. ---
  const typeChipsEl = document.getElementById("type-chips");
  const topicListEl = document.getElementById("topic-list");
  const topicSummaryEl = document.getElementById("topic-summary");
  const topicSearchEl = document.getElementById("topic-search");
  const topicEmptyEl = document.getElementById("topic-empty");
  const topicSelectAllEl = document.getElementById("topic-select-all");
  const topicDeselectAllEl = document.getElementById("topic-deselect-all");
  const topicDropdownEl = document.getElementById("topic-dropdown");

  const topLevelTypes = [...typeLabels.keys()].filter(p => !p.includes("."));
  const groupOrder = [...new Set([...topicMeta.values()].map(m => m.group))];
  const topicsByGroup = new Map(
    groupOrder.map(g => [g, [...topicMeta].filter(([, m]) => m.group === g).map(([s]) => s)])
  );
  // Per-value counts for the dropdown rows (how many events carry each topic /
  // any topic in each group).
  const topicCounts = new Map(
    allTopics.map(s => [s, events.filter(e => (e.topics || []).includes(s)).length])
  );
  const groupCounts = new Map(groupOrder.map(g => {
    const slugs = new Set(topicsByGroup.get(g));
    return [g, events.filter(e => (e.topics || []).some(t => slugs.has(t))).length];
  }));

  function buildTagControls() {
    typeChipsEl.innerHTML = topLevelTypes
      .map(p => tagChip("type", p, typeLabels.get(p), GROUP_HUE.type, false))
      .join("");
    const parts = [];
    for (const group of groupOrder) {
      // Group header is a bulk toggle: checking/unchecking selects/deselects
      // every topic in the group (like the global Select all / Deselect all).
      const ghue = GROUP_HUE[group] ?? 0;
      parts.push(
        '<label class="dropdown-item dropdown-group-item" data-group="' + escapeHtml(group) + '">'
        + '<input type="checkbox" data-group-cb="' + escapeHtml(group) + '">'
        + '<span class="topic-swatch" style="--h:' + ghue + '"></span>'
        + '<span class="dropdown-group-label">' + escapeHtml(group) + "</span>"
        + '<button type="button" class="only-btn" data-only-group="' + escapeHtml(group) + '">Only</button>'
        + '<span class="count">' + (groupCounts.get(group) || 0) + "</span></label>"
      );
      for (const slug of topicsByGroup.get(group)) {
        parts.push(
          '<label class="dropdown-item" data-topic="' + escapeHtml(slug) + '">'
          + '<input type="checkbox" data-topic-cb="' + escapeHtml(slug) + '">'
          + '<span class="topic-swatch" style="--h:' + topicHue(slug) + '"></span>'
          + '<span>' + escapeHtml(topicMeta.get(slug).label) + "</span>"
          + '<button type="button" class="only-btn" data-only-topic="' + escapeHtml(slug) + '">Only</button>'
          + '<span class="count">' + (topicCounts.get(slug) || 0) + "</span></label>"
        );
      }
    }
    topicListEl.innerHTML = parts.join("");
  }

  function updateTagControls() {
    for (const btn of typeChipsEl.querySelectorAll(".tag-chip")) {
      btn.classList.toggle("on", selectedTypes.has(btn.dataset.tagval));
    }
    for (const cb of topicListEl.querySelectorAll("input[data-topic-cb]")) {
      cb.checked = selectedTopics.has(cb.dataset.topicCb);
    }
    // A group checkbox is checked when ALL its topics are selected, and shows
    // an indeterminate dash when only some are.
    for (const cb of topicListEl.querySelectorAll("input[data-group-cb]")) {
      const slugs = topicsByGroup.get(cb.dataset.groupCb) || [];
      const on = slugs.filter(s => selectedTopics.has(s)).length;
      cb.checked = on === slugs.length;
      cb.indeterminate = on > 0 && on < slugs.length;
    }
    const n = selectedTopics.size, total = allTopics.length;
    topicSummaryEl.textContent =
      n === total ? "All " + total + " topics"
      : n === 0 ? "No topics"
      : n === 1 ? topicMeta.get([...selectedTopics][0]).label
      : n + " of " + total + " topics";
  }

  buildTagControls();
  updateTagControls();  // reflect the all-selected default (checkboxes + summary)
  // Type chips in the control row toggle the type filter.
  typeChipsEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".tag-chip");
    if (btn) toggleTag("type", btn.dataset.tagval);
  });
  // Drive off the checkbox's native `change` (same pattern as the Sources
  // dropdown). A topic checkbox toggles its own slug; a group checkbox
  // selects/deselects every topic in that group.
  // "Only" isolates the topic filter to one topic (or one group's topics).
  topicListEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".only-btn");
    if (!btn) return;
    e.preventDefault(); e.stopPropagation();
    selectedTopics.clear();
    if (btn.dataset.onlyTopic !== undefined) {
      selectedTopics.add(btn.dataset.onlyTopic);
    } else if (btn.dataset.onlyGroup !== undefined) {
      for (const s of topicsByGroup.get(btn.dataset.onlyGroup) || []) selectedTopics.add(s);
    }
    updateTagControls();
    render();
  });
  topicListEl.addEventListener("change", (e) => {
    const cb = e.target;
    if (cb.dataset.topicCb !== undefined) {
      if (cb.checked) selectedTopics.add(cb.dataset.topicCb);
      else selectedTopics.delete(cb.dataset.topicCb);
    } else if (cb.dataset.groupCb !== undefined) {
      for (const s of topicsByGroup.get(cb.dataset.groupCb) || []) {
        if (cb.checked) selectedTopics.add(s); else selectedTopics.delete(s);
      }
    } else return;
    updateTagControls();
    render();
  });
  topicSelectAllEl.addEventListener("click", () => {
    for (const s of allTopics) selectedTopics.add(s);
    updateTagControls();
    render();
  });
  topicDeselectAllEl.addEventListener("click", () => {
    selectedTopics.clear();
    updateTagControls();
    render();
  });
  topicSearchEl.addEventListener("input", () => {
    const q = topicSearchEl.value.trim().toLowerCase();
    let visible = 0;
    for (const label of topicListEl.querySelectorAll("label[data-topic]")) {
      const match = !q || label.textContent.toLowerCase().includes(q);
      label.hidden = !match;
      if (match) visible++;
    }
    // A group header shows if its own name matches, or any of its child topic
    // rows (the following siblings up to the next group header) is visible.
    for (const g of topicListEl.querySelectorAll(".dropdown-group-item")) {
      const nameMatch = !q || g.textContent.toLowerCase().includes(q);
      let n = g.nextElementSibling, childVisible = false;
      while (n && !n.classList.contains("dropdown-group-item")) {
        if (!n.hidden) { childVisible = true; break; }
        n = n.nextElementSibling;
      }
      g.hidden = !(nameMatch || childVisible);
      if (!g.hidden && nameMatch) visible++;
    }
    topicEmptyEl.hidden = visible > 0;
  });
  // Focus the list's search box on open — but not on touch screens, where
  // focusing pops the keyboard over the list being opened.
  const finePointer = matchMedia("(pointer: fine)");
  topicDropdownEl.addEventListener("toggle", () => {
    if (topicDropdownEl.open && finePointer.matches) topicSearchEl.focus();
  });

  let searchQuery = "";
  let rankedOrder = null;  // number[] | null — event ids in rank order, null when no search is active

  const SEARCH_SCORE_THRESHOLD = 1.0;  // Drop weak matches — spec §2.4

  function updateSearch() {
    const q = searchEl.value.trim();
    searchQuery = q;
    if (!q) {
      rankedOrder = null;
      document.body.classList.remove("searching");
    } else if (!indexed) {
      // Searched before the index finished: run once it has.
      buildIndex().then(updateSearch);
      return;
    } else {
      const results = miniSearch.search(q).filter(r => r.score >= SEARCH_SCORE_THRESHOLD);
      rankedOrder = results.map(r => r.id);
      document.body.classList.add("searching");
    }
    render();
  }
  // Debounced: each search re-filters every event.
  let searchTimer = null;
  searchEl.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(updateSearch, 150);
  });
  searchEl.addEventListener("focus", buildIndex);

  function setLocationFilter(loc) {
    locationFilter = loc;
    render();
  }

  // Toggle a type/topic tag in its filter set (OR within a facet). Called both
  // by clicking a chip on a card and by the filter controls.
  function toggleTag(kind, val, on) {
    const set = kind === "type" ? selectedTypes : selectedTopics;
    const active = on === undefined ? !set.has(val) : on;
    if (active) set.add(val); else set.delete(val);
    updateTagControls();
    render();
  }

  // Topics use an all-on / deselect model, so clicking a topic chip on a card
  // to "turn it off" would do almost nothing (drop 1 of ~50 selected topics).
  // Instead a card topic chip ISOLATES the feed to that topic ("only" mode);
  // clicking the already-isolated topic again restores all topics.
  function isolateTopic(val) {
    const onlyThis = selectedTopics.size === 1 && selectedTopics.has(val);
    selectedTopics.clear();
    if (onlyThis) { for (const s of allTopics) selectedTopics.add(s); }
    else { selectedTopics.add(val); }
    updateTagControls();
    render();
  }

  // A topic filter is "active" only when it's a strict subset — with every
  // topic selected (the default) no topic chip should look filled.
  const topicFilterActive = () => selectedTopics.size !== allTopics.length;

  // Event delegation for anything inside the event list.
  list.addEventListener("click", (e) => {
    const tagBtn = e.target.closest(".tag-chip");
    if (tagBtn) {
      if (tagBtn.dataset.tagkind === "topic") isolateTopic(tagBtn.dataset.tagval);
      else toggleTag(tagBtn.dataset.tagkind, tagBtn.dataset.tagval);
      return;
    }
    const srcBtn = e.target.closest(".source-btn");
    if (srcBtn) { isolateSource(srcBtn.dataset.source, true); return; }
    const locBtn = e.target.closest(".location-btn");
    if (locBtn) { setLocationFilter(locBtn.dataset.location); return; }
    const desc = e.target.closest('.description[role="button"]');
    if (desc) desc.classList.toggle("expanded");
  });
  list.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const desc = e.target.closest('.description[role="button"]');
    if (desc) { e.preventDefault(); desc.classList.toggle("expanded"); }
  });

  // Build source list (checkbox rows, with per-source counts). A multi-source
  // event counts toward each of its sources.
  const sourceCounts = new Map();
  for (const s of allSources) {
    sourceCounts.set(s, events.filter(e => (e.sources || []).includes(s)).length);
  }
  const checkboxes = new Map();  // source -> input element
  for (const s of allSources) {
    const label = document.createElement("label");
    label.className = "dropdown-item";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = true; cb.dataset.source = s;
    cb.addEventListener("change", () => {
      if (cb.checked) selected.add(s); else selected.delete(s);
      updateSourceSummary();
      render();
    });
    checkboxes.set(s, cb);
    label.appendChild(cb);
    const name = document.createElement("span");
    name.textContent = s;
    label.appendChild(name);
    // "Only" isolates the filter to this source (deselect all others).
    const only = document.createElement("button");
    only.type = "button"; only.className = "only-btn"; only.textContent = "Only";
    only.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      isolateSource(s);
    });
    label.appendChild(only);
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = sourceCounts.get(s);
    label.appendChild(count);
    sourceListEl.appendChild(label);
  }

  // Show only events listed by `s` ("Only" in the list, or a "Listed by"
  // name on an event). From an event, clicking the already-isolated source
  // again restores all sources, like topic chips.
  function isolateSource(s, toggle = false) {
    const onlyThis = selected.size === 1 && selected.has(s);
    selected.clear();
    if (toggle && onlyThis) for (const x of allSources) selected.add(x);
    else selected.add(s);
    for (const [name, box] of checkboxes) box.checked = selected.has(name);
    updateSourceSummary();
    render();
  }

  selectAllEl.addEventListener("click", () => {
    for (const s of allSources) { selected.add(s); checkboxes.get(s).checked = true; }
    updateSourceSummary();
    render();
  });
  deselectAllEl.addEventListener("click", () => {
    selected.clear();
    for (const cb of checkboxes.values()) cb.checked = false;
    updateSourceSummary();
    render();
  });

  // Live-filter the source list as the user types. Case-insensitive substring
  // match against the source name. Nothing else about the state changes.
  sourceSearchEl.addEventListener("input", () => {
    const q = sourceSearchEl.value.trim().toLowerCase();
    let visible = 0;
    for (const s of allSources) {
      const label = sourceListEl.querySelector(`label input[data-source="${cssEscape(s)}"]`)?.closest("label");
      if (!label) continue;
      const match = !q || s.toLowerCase().includes(q);
      label.hidden = !match;
      if (match) visible++;
    }
    sourceEmptyEl.hidden = visible > 0;
  });
  sourceDropdownEl.addEventListener("toggle", () => {
    if (sourceDropdownEl.open && finePointer.matches) sourceSearchEl.focus();
  });
  function cssEscape(v) {
    return (window.CSS && CSS.escape) ? CSS.escape(v)
      : String(v).replace(/["\\]/g, "\\$&");
  }

  function updateSourceSummary() {
    const n = selected.size, total = allSources.length;
    if (n === total) summaryEl.textContent = "All " + total + " venues";
    else if (n === 0) summaryEl.textContent = "None selected";
    else if (n === 1) summaryEl.textContent = [...selected][0];
    else summaryEl.textContent = n + " of " + total + " venues";
  }
  updateSourceSummary();

  // Format a Date's local calendar day as YYYY-MM-DD for <input type="date">.
  const toISODate = (d) => {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  };
  // Date formatter for the search-active flat view. Declared here
  // (not next to renderFlat) so it's initialized before readStateFromUrl() —
  // a ?q= shared link triggers a search-active render during page load, which
  // calls renderFlat; a const declared later would still be in its temporal
  // dead zone at that point and throw, hanging the page on "Loading…".
  const flatDateFmt = new Intl.DateTimeFormat(undefined, {
    weekday: "short", month: "short", day: "numeric",
  });
  const timeFmt = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
  const dateFmt = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" });
  const rowDateFmt = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" });
  const stripDowFmt = new Intl.DateTimeFormat(undefined, { weekday: "short" });
  const stripMonthFmt = new Intl.DateTimeFormat(undefined, { month: "short" });
  const DAY_STRIP_MAX = 90;
  const dowFmt = new Intl.DateTimeFormat(undefined, { weekday: "long" });

  // Incremental rendering: render() hands the results to a queue and about
  // CHUNK rows are built at a time as the sentinel nears the viewport.
  // Rendering all ~5k rows (~100k nodes) took seconds per filter change on a
  // phone. In the grouped view the queue holds days ({key, date, events}),
  // each showing at most DAY_CAP rows until its "Show more" is pressed; in
  // the search view it holds events. Declared here, before
  // readStateFromUrl(), for the same TDZ reason as flatDateFmt.
  const CHUNK = 60;
  const DAY_CAP = 10;
  let queue = [], queuePos = 0, queueFlat = false, dayCap = DAY_CAP;
  const sentinel = document.createElement("div");
  sentinel.className = "sentinel";
  const io = new IntersectionObserver((entries) => {
    if (entries.some(e => e.isIntersecting)) renderMore();
  }, {rootMargin: "0px 0px 1500px 0px"});
  function renderMore() {
    let html = "";
    if (queueFlat) {
      const end = Math.min(queuePos + CHUNK, queue.length);
      html = renderFlat(queue.slice(queuePos, end));
      queuePos = end;
    } else {
      let rows = 0;
      while (queuePos < queue.length && rows < CHUNK) {
        const day = queue[queuePos++];
        html += renderDay(day);
        rows += Math.min(day.events.length, dayCap);
      }
    }
    sentinel.insertAdjacentHTML("beforebegin", html);
    // Re-observing delivers a fresh intersection check, so this keeps
    // filling until the sentinel is a screen and a half below the fold.
    io.unobserve(sentinel);
    if (queuePos < queue.length) io.observe(sentinel);
  }
  // Apply an explicit calendar range (Date objects, both inclusive).
  // `preset` names the preset that produced it (null for a custom range);
  // `fromHour` starts the range later than midnight (the weekend's Friday).
  function setDateRange(from, to, preset = null, fromHour = 0) {
    fromEl.value = from ? toISODate(from) : "";
    toEl.value = to ? toISODate(to) : "";
    dateFrom = from ? new Date(toISODate(from) + "T00:00:00") : null;
    if (dateFrom && fromHour) dateFrom.setHours(fromHour);
    dateTo   = to   ? new Date(toISODate(to)   + "T23:59:59") : null;
    activePreset = preset;
    updatePresetHighlight();
    render();
  }
  // "This week" = today through the coming Sunday. Week-anchored, not rolling.
  function weekSunday() {
    const today = new Date();
    const daysToSunday = (7 - today.getDay()) % 7; // 0 = today is Sunday
    const sunday = new Date(today);
    sunday.setDate(today.getDate() + daysToSunday);
    return sunday;
  }
  function tomorrow() {
    const t = new Date();
    t.setDate(t.getDate() + 1);
    return t;
  }
  // Last day of the current calendar month (month-anchored, not rolling 30d).
  function monthEnd() {
    const t = new Date();
    return new Date(t.getFullYear(), t.getMonth() + 1, 0);
  }
  // "This weekend" = Friday 5pm through Sunday (Friday daytime listings are
  // mostly weekday fare); on a Saturday or Sunday, today through Sunday.
  function weekendRange() {
    const today = new Date();
    const dow = today.getDay();  // 0 = Sunday … 6 = Saturday
    if (dow === 6 || dow === 0) return [today, weekSunday(), 0];
    const friday = new Date(today);
    friday.setDate(today.getDate() + (5 - dow));
    return [friday, weekSunday(), 17];
  }
  // Date presets, each [from, to, fromHour?]. They resolve against *today*
  // every time they run — the point of bookmarking ?dates=weekend is that
  // it always means the coming weekend. Shared by the buttons and
  // readStateFromUrl.
  const PRESETS = {
    today: () => [new Date(), new Date()],
    tomorrow: () => [tomorrow(), tomorrow()],
    weekend: weekendRange,
    week: () => [new Date(), weekSunday()],
    month: () => [new Date(), monthEnd()],
  };
  const presetEls = {
    today: presetTodayEl, tomorrow: presetTomorrowEl, weekend: presetWeekendEl,
    week: presetWeekEl, month: presetMonthEl,
  };
  // The preset in effect, tracked explicitly: two presets can cover the same
  // dates (on a Friday, "This week" and "This weekend" both end Sunday).
  let activePreset = null;
  function applyPreset(name) {
    const [from, to, fromHour = 0] = PRESETS[name]();
    setDateRange(from, to, name, fromHour);
  }
  function updatePresetHighlight() {
    for (const [name, el] of Object.entries(presetEls)) {
      el.classList.toggle("active", name === activePreset);
    }
  }

  fromEl.addEventListener("input", () => {
    dateFrom = fromEl.value ? new Date(fromEl.value + "T00:00:00") : null;
    activePreset = null;
    updatePresetHighlight();
    render();
  });
  toEl.addEventListener("input", () => {
    dateTo = toEl.value ? new Date(toEl.value + "T23:59:59") : null;
    activePreset = null;
    updatePresetHighlight();
    render();
  });
  // Presets toggle: clicking the active preset clears the date range.
  for (const [name, el] of Object.entries(presetEls)) {
    el.addEventListener("click", () => {
      if (activePreset === name) setDateRange(null, null);
      else applyPreset(name);
    });
  }
  resetEl.addEventListener("click", () => {
    for (const s of allSources) { selected.add(s); checkboxes.get(s).checked = true; }
    updateSourceSummary();
    fromEl.value = ""; toEl.value = ""; dateFrom = dateTo = null;
    activePreset = null;
    updatePresetHighlight();
    searchEl.value = "";
    selectedTypes.clear();
    // Topics default to all-selected (deselect to narrow), like Sources.
    selectedTopics.clear();
    for (const s of allTopics) selectedTopics.add(s);
    updateTagControls();
    updateSearch();          // clears searchQuery / rankedOrder, removes .searching, and re-renders
    setLocationFilter(null);
  });

  // --- URL sync: filter state <-> query string ---
  // Every state mutation ends in render(), so writing the URL from render()
  // is the single choke point. `replaceState` (not push) keeps the browser's
  // back button meaningful — users don't want a history entry per keystroke.
  function writeStateToUrl() {
    const p = new URLSearchParams();
    if (searchQuery) p.set("q", searchQuery);
    if (selected.size !== allSources.length) {
      p.set("sources", [...selected].join(","));
    }
    // Encode an active preset as a symbolic value (?dates=today|weekend|…)
    // so a bookmarked link always resolves to the CURRENT day/week, not the
    // frozen date it was created on. Only a custom range falls back to from/to.
    if (activePreset) {
      p.set("dates", activePreset);
    } else {
      if (fromEl.value) p.set("from", fromEl.value);
      if (toEl.value) p.set("to", toEl.value);
    }
    if (locationFilter) p.set("loc", locationFilter);
    if (selectedTypes.size) p.set("type", [...selectedTypes].join(","));
    // Like sources: emit the topic list only when it's a subset (absent = all).
    if (selectedTopics.size !== allTopics.length) {
      p.set("topic", [...selectedTopics].join(","));
    }
    const qs = p.toString();
    const url = qs ? `${location.pathname}?${qs}` : location.pathname;
    if (location.pathname + location.search !== url) {
      history.replaceState(null, "", url);
    }
  }

  // Restore state from ?q=&sources=&from=&to=&loc= on a fresh load. Called
  // once after DOM refs + filter machinery are set up. Silently ignores
  // unknown source names and malformed dates so a shared link survives DB
  // churn.
  function readStateFromUrl() {
    const p = new URLSearchParams(location.search);
    const srcs = p.get("sources");
    if (srcs !== null) {
      const wanted = new Set(srcs.split(",").filter(Boolean));
      selected.clear();
      for (const s of allSources) {
        const on = wanted.has(s);
        if (on) selected.add(s);
        const cb = checkboxes.get(s);
        if (cb) cb.checked = on;
      }
      updateSourceSummary();
    }
    // Symbolic date presets resolve live against today's date; a raw
    // from/to range is the fallback. `dates` wins if both are somehow present.
    const dates = p.get("dates");
    if (Object.hasOwn(PRESETS, dates || "")) {
      applyPreset(dates);
    } else {
      const from = p.get("from");
      const to = p.get("to");
      if (from && /^\d{4}-\d{2}-\d{2}$/.test(from)) {
        fromEl.value = from;
        dateFrom = new Date(from + "T00:00:00");
      }
      if (to && /^\d{4}-\d{2}-\d{2}$/.test(to)) {
        toEl.value = to;
        dateTo = new Date(to + "T23:59:59");
      }
    }
    const loc = p.get("loc");
    if (loc) {
      // setLocationFilter shows the pill and calls render() itself.
      setLocationFilter(loc);
    }
    // Tag facets. Unknown paths/slugs (e.g. from an old link after a taxonomy
    // change) are silently dropped so shared links open gracefully.
    const typeParam = p.get("type");
    if (typeParam) {
      for (const path of typeParam.split(",").filter(Boolean)) {
        if (typeLabels.has(path)) selectedTypes.add(path);
      }
    }
    // Topics default to all-selected; a `topic` param means "only these"
    // (a subset), so replace the default set with exactly the listed slugs.
    const topicParam = p.get("topic");
    if (topicParam !== null) {
      const wanted = new Set(topicParam.split(",").filter(Boolean));
      selectedTopics.clear();
      for (const slug of allTopics) {
        if (wanted.has(slug)) selectedTopics.add(slug);
      }
    }
    if (typeParam || topicParam !== null) updateTagControls();
    const q = p.get("q");
    if (q) {
      searchEl.value = q;
      updateSearch();
    }
  }

  // Phones get the system share sheet; elsewhere the link is copied.
  const canShare = !!navigator.share && matchMedia("(pointer: coarse)").matches;
  const copyLabel = canShare ? "Share this view" : "Copy link to this view";
  copyEl.textContent = copyLabel;
  copyEl.addEventListener("click", async () => {
    if (canShare) {
      try { await navigator.share({title: document.title, url: location.href}); } catch {}
      return;
    }
    try {
      await navigator.clipboard.writeText(location.href);
      copyEl.textContent = "Link copied";
      copyEl.classList.add("copied");
    } catch {
      copyEl.textContent = "Couldn't copy. Copy the address bar instead.";
    }
    setTimeout(() => {
      copyEl.textContent = copyLabel;
      copyEl.classList.remove("copied");
    }, 2000);
  });

  // --- Filter sheet (phones). On wide screens the panel is a sidebar and
  // these are no-ops visually. ---
  function openSheet() {
    filters.classList.add("open");
    backdropEl.hidden = false;
    document.body.classList.add("sheet-open");
    filtersBtnEl.setAttribute("aria-expanded", "true");
    filtersDoneEl.focus({preventScroll: true});
  }
  function closeSheet() {
    if (!filters.classList.contains("open")) return;
    filters.classList.remove("open");
    backdropEl.hidden = true;
    document.body.classList.remove("sheet-open");
    filtersBtnEl.setAttribute("aria-expanded", "false");
    filtersBtnEl.focus({preventScroll: true});
  }
  filtersBtnEl.addEventListener("click", openSheet);
  filtersDoneEl.addEventListener("click", closeSheet);
  backdropEl.addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeSheet();
    // "/" jumps to search, unless you're already typing somewhere.
    const typing = e.target.closest?.("input, textarea, select, [contenteditable]");
    if (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      searchEl.focus();
      searchEl.select();
    }
  });

  // Day headings stick just below the sticky search bar, whatever its height.
  new ResizeObserver(() => {
    document.documentElement.style.setProperty("--sticky-top", topbarEl.offsetHeight + "px");
  }).observe(topbarEl);

  // Active-filter pills above the list; each × clears that one filter.
  activeFiltersEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".pill-clear");
    if (!btn) return;
    const {clear, val} = btn.dataset;
    if (clear === "sources") selectAllEl.click();
    else if (clear === "topics") topicSelectAllEl.click();
    else if (clear === "type") toggleTag("type", val, false);
    else if (clear === "dates") setDateRange(null, null);
    else if (clear === "location") setLocationFilter(null);
  });

  // Day strip: jump to a day, rendering rows up to it first if needed.
  dayStripEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".day-btn");
    if (!btn) return;
    const idx = queue.findIndex(day => day.key === btn.dataset.day);
    if (idx < 0) return;
    while (queuePos <= idx) renderMore();
    list.querySelector('h2.date[data-day="' + btn.dataset.day + '"]')
      ?.scrollIntoView({block: "start"});
  });

  if (events.length === 0) {
    list.innerHTML = '<div class="empty">No upcoming events.</div>';
    meta.innerHTML = updatedHtml;
    return;
  }
  filters.hidden = false;
  readStateFromUrl();
  render();
  // Fill the search index once the first rows are on screen.
  setTimeout(buildIndex, 300);

  function render() {
    writeStateToUrl();
    const now = new Date();
    const otherFiltersPass = (ev) => {
      if (ev._start < now) return false;
      const evSources = ev.sources || [];
      if (!evSources.some(s => selected.has(s))) return false;
      if (dateFrom && ev._start < dateFrom) return false;
      if (dateTo && ev._start > dateTo) return false;
      if (locationFilter && ev.location !== locationFilter) return false;
      // Type filter: OR within the facet; a selected partial path (e.g. "talk")
      // matches any deeper path on the event ("talk.reading") — branch match.
      if (selectedTypes.size) {
        const paths = evTypePaths(ev);
        const hit = [...selectedTypes].some(sel =>
          paths.some(p => p === sel || p.startsWith(sel + ".")));
        if (!hit) return false;
      }
      // Topic filter (all-on, deselect to narrow). When a strict subset is
      // selected the filter is ACTIVE: show only events carrying one of the
      // selected topics — untagged events are hidden. With every topic selected
      // (the default) the filter is off and everything shows.
      if (topicFilterActive()) {
        const evTopics = ev.topics || [];
        if (!evTopics.some(t => selectedTopics.has(t))) return false;
      }
      return true;
    };

    let filtered;
    let flat = false;
    if (rankedOrder) {
      // Search-active branch: apply other filters AFTER ranking (spec §1.3),
      // preserving MiniSearch's descending-score order.
      filtered = rankedOrder.map(id => events[id]).filter(otherFiltersPass);
      flat = true;
    } else {
      filtered = events.filter(otherFiltersPass);
    }

    const isFiltered = filtered.length !== events.length;
    const n = (x) => x.toLocaleString();
    meta.innerHTML = "<span>" + (isFiltered ? n(filtered.length) + " of " + n(events.length)
      : n(events.length)) + " upcoming events</span>" + updatedHtml;
    renderChrome(filtered, flat);

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">No events match. Remove a filter or try a different search.</div>';
      return;
    }
    queuePos = 0; queueFlat = flat;
    queue = flat ? filtered : groupByDay(filtered);
    // A single day's results (Today, Tomorrow, a one-day range) show in full:
    // the reader already chose that day.
    dayCap = !flat && queue.length === 1 ? Infinity : DAY_CAP;
    list.innerHTML = "";
    list.appendChild(sentinel);
    renderMore();
  }

  // The pills for each active filter, as [clear-key, label, value?].
  function activeFilterList() {
    const out = [];
    if (selected.size !== allSources.length) out.push(["sources", summaryEl.textContent]);
    for (const path of selectedTypes) out.push(["type", typeLabels.get(path) || path, path]);
    if (topicFilterActive()) out.push(["topics", topicSummaryEl.textContent]);
    if (dateFrom || dateTo) {
      const preset = document.querySelector(".presets .preset-btn.active");
      const fmt = (d) => rowDateFmt.format(d);
      out.push(["dates", preset ? preset.textContent
        : dateFrom && dateTo ? fmt(dateFrom) + " to " + fmt(dateTo)
        : dateFrom ? "From " + fmt(dateFrom) : "Until " + fmt(dateTo)]);
    }
    if (locationFilter) out.push(["location", locationFilter]);
    return out;
  }

  // Everything around the list that depends on the current results: active
  // filter pills, the Filters badge, the sheet's Show button, the day strip.
  function renderChrome(filtered, flat) {
    const active = activeFilterList();
    activeFiltersEl.innerHTML = active.map(([key, label, val]) =>
      '<span class="active-pill"><span class="pill-label">' + escapeHtml(label) + "</span>"
      + '<button type="button" class="pill-clear" data-clear="' + key + '"'
      + (val ? ' data-val="' + escapeHtml(val) + '"' : "")
      + ' aria-label="Remove filter: ' + escapeHtml(label) + '">×</button></span>'
    ).join("");
    filtersCountEl.hidden = active.length === 0;
    filtersCountEl.textContent = active.length;
    filtersDoneEl.textContent = filtered.length === 0 ? "No events match"
      : "Show " + filtered.length.toLocaleString() + (filtered.length === 1 ? " event" : " events");

    // Day strip: the first DAY_STRIP_MAX days that have results (grouped view only).
    const days = [];
    if (!flat) {
      for (const ev of filtered) {
        const key = toISODate(ev._start);
        if (days.length && days[days.length - 1][0] === key) continue;
        days.push([key, ev._start]);
        if (days.length >= DAY_STRIP_MAX) break;
      }
    }
    dayStripEl.hidden = days.length < 2;
    let prevMonth = null;
    dayStripEl.innerHTML = days.map(([key, d]) => {
      // The first day of each month in the strip shows the month instead of the weekday.
      const month = d.getMonth();
      const top = prevMonth !== null && month !== prevMonth ? stripMonthFmt.format(d) : stripDowFmt.format(d);
      prevMonth = month;
      return '<button type="button" class="day-btn" data-day="' + key + '" aria-label="'
        + escapeHtml(dateFmt.format(d)) + '"><span class="dow">' + escapeHtml(top)
        + '</span><span class="dom">' + d.getDate() + "</span></button>";
    }).join("");
  }

  // One tag chip. kind = "type" | "topic"; val is the dot-path or slug.
  function tagChip(kind, val, label, hue, active) {
    const tip = kind === "topic" ? "Show only " + label : "Filter by " + label;
    return '<button type="button" class="tag-chip tag-' + kind + (active ? " on" : "")
      + '" data-tagkind="' + kind + '" data-tagval="' + escapeHtml(val) + '"'
      + ' style="--h:' + hue + '" title="' + escapeHtml(tip) + '">'
      + escapeHtml(label) + "</button>";
  }

  // The tag row for an event: its type chips then topic chips (empty → "").
  function renderTags(ev) {
    const chips = [];
    for (const path of evTypePaths(ev)) {
      chips.push(tagChip("type", path, typeLabels.get(path) || path,
                         GROUP_HUE.type, selectedTypes.has(path)));
    }
    for (const slug of ev.topics || []) {
      const m = topicMeta.get(slug);
      if (!m) continue;
      chips.push(tagChip("topic", slug, m.label, topicHue(slug),
                         topicFilterActive() && selectedTopics.has(slug)));
    }
    return chips.length ? '<div class="tags">' + chips.join("") + "</div>" : "";
  }

  // Build one event's card HTML. `timeHtml` is the pre-formatted, already-escaped
  // time string to place in the `.time` slot — callers control whether it's a
  // time-only string ("8:00 PM", grouped view) or a full date+time ("Fri Oct 4 · 8:00 PM",
  // search-active flat view).
  function renderEventRow(ev, timeHtml) {
    const title = escapeHtml(ev.title);
    const titleHtml = ev.url
      ? '<a href="' + escapeHtml(ev.url) + '" target="_blank" rel="noopener">' + title + "</a>"
      : title;
    const loc = ev.location
      ? '<button type="button" class="location-btn" data-location="'
          + escapeHtml(ev.location) + '" title="Show only events here">'
          + escapeHtml(ev.location) + "</button>"
      : "";
    // Always name the source(s), even when the location repeats it: hiding it
    // only when the location text contained the name was inconsistent
    // ("Berkeley Rep" vs "Berkeley Repertory Theatre").
    const srcs = ev.sources || [];
    const src = srcs.length ? '<span class="source">' + srcs.map(s =>
      '<button type="button" class="source-btn" data-source="' + escapeHtml(s)
      + '" title="Show only events listed by ' + escapeHtml(s) + '">' + escapeHtml(s) + "</button>"
    ).join(", ") + "</span>" : "";
    const where = loc || src ? '<div class="where">' + loc + src + "</div>" : "";
    const desc = renderDescription(ev.description);
    // Thumbnail is optional — some sources don't expose one, and we don't
    // want a broken-image slot. Skip the div entirely if no image_url.
    const thumb = ev.image_url
      ? '<div class="thumb"><img loading="lazy" decoding="async" alt="" src="'
          + escapeHtml(ev.image_url) + '"></div>'
      : "";
    return (
      '<article class="event' + (thumb ? "" : " no-thumb") + '" data-start="'
        + escapeHtml(ev.start_time) + '">' +
        '<div class="time">' + timeHtml + "</div>" +
        '<div class="details">' +
          '<div class="title">' + titleHtml + "</div>" +
          where + desc + renderTags(ev) +
        "</div>" +
        thumb +
      "</article>"
    );
  }

  // Time-sorted events → [{key, date, events}] per local calendar day.
  function groupByDay(evs) {
    const days = [];
    for (const ev of evs) {
      const key = toISODate(ev._start);
      const last = days[days.length - 1];
      if (last && last.key === key) last.events.push(ev);
      else days.push({key, date: ev._start, events: [ev]});
    }
    return days;
  }

  // The sticky day heading carries the date, so rows show only the time.
  // (A function declaration, not a const: render() runs during
  // readStateFromUrl(), before this line, and a const would still be in its
  // temporal dead zone.)
  function dayRows(evs) {
    return evs.map(ev => renderEventRow(ev, timeHtml(ev._start))).join("");
  }

  // One day of the grouped view: heading, its first dayCap rows, and a
  // button for the rest.
  function renderDay(day) {
    const rest = day.events.length - dayCap;
    return '<section class="day" data-day="' + day.key + '">'
      + '<h2 class="date" data-day="' + day.key + '">' + escapeHtml(dateFmt.format(day.date)) + "</h2>"
      + dayRows(day.events.slice(0, dayCap))
      + (rest > 0
        ? '<button type="button" class="day-more" data-day="' + day.key + '">Show ' + rest
          + " more on " + escapeHtml(dowFmt.format(day.date)) + "</button>"
        : "")
      + "</section>";
  }

  // "Show N more" expands that day in place.
  list.addEventListener("click", (e) => {
    const btn = e.target.closest(".day-more");
    if (!btn) return;
    const day = queue.find(d => d.key === btn.dataset.day);
    if (!day) return;
    btn.insertAdjacentHTML("beforebegin", dayRows(day.events.slice(dayCap)));
    // Keep keyboard focus in the list: move it to the first revealed event.
    const section = btn.closest(".day");
    btn.remove();
    section.querySelectorAll(".event")[dayCap]?.querySelector("a, button")
      ?.focus({preventScroll: true});
  });

  // Flat ranked rendering — used when a search query is active. No date
  // headers; each row's `.time` shows the full date + time so the reader
  // always knows *when* the top-of-list result is. (flatDateFmt is declared
  // near the top of the IIFE so it's initialized before readStateFromUrl,
  // which can trigger a search-active render during load via a ?q= link.)
  function renderFlat(events) {
    const parts = [];
    for (const ev of events) {
      const when = '<span class="td-date">' + escapeHtml(flatDateFmt.format(ev._start))
        + "</span>" + timeHtml(ev._start);
      parts.push(renderEventRow(ev, when));
    }
    return parts.join("");
  }

  // "7:30" with its "PM" in a separate span so it can be set smaller.
  function timeHtml(d) {
    let main = "", period = "";
    for (const part of timeFmt.formatToParts(d)) {
      if (part.type === "dayPeriod") period += part.value;
      else main += part.value;
    }
    return '<span class="td-time">' + escapeHtml(main.trim())
      + (period ? '<span class="ampm">' + escapeHtml(period.trim()) + "</span>" : "")
      + "</span>";
  }
})();

// Pick the first sentence for the preview. Falls back to a hard char cap so a
// single run-on sentence still gets truncated. The `\.\s|\!\s|\?\s` lookahead
// keeps the terminator in the match while requiring real word-boundary
// whitespace so we don't split on abbreviations at end of string.
const PREVIEW_MAX = 180;
function firstSentence(text) {
  const t = text.replace(/\s+/g, " ").trim();
  const m = t.match(/^[^.!?]*[.!?](?=\s|$)/);
  let s = m ? m[0].trim() : t;
  if (s.length > PREVIEW_MAX) s = s.slice(0, PREVIEW_MAX).replace(/\s+\S*$/, "").trim();
  return s;
}
function renderDescription(text) {
  if (!text) return "";
  const full = text.replace(/\s+/g, " ").trim();
  if (!full) return "";
  const preview = firstSentence(full);
  // Nothing to reveal — render as plain (non-interactive) text.
  if (preview.length >= full.length) {
    return '<div class="description">' + escapeHtml(full) + "</div>";
  }
  return (
    '<div class="description" role="button" tabindex="0" aria-label="Expand description">' +
      '<span class="desc-preview">' + escapeHtml(preview) +
        '<span class="desc-toggle">… more</span></span>' +
      '<span class="desc-full">' + escapeHtml(full) +
        ' <span class="desc-toggle">less</span></span>' +
    "</div>"
  );
}

function escapeHtml(s) {
  return s == null ? "" : String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
