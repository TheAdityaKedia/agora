services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: agora
      POSTGRES_DB: agora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://agora:agora@db:5432/agora
    depends_on:
      - db

  scraper:
    build: ./service
    command: python main.py
    environment:
      DATABASE_URL: postgresql://agora:agora@db:5432/agora
      EVENTS_JSON_PATH: /out/events.json
      # Region for Bedrock (AI tagging). Creds come from the mounted ~/.aws
      # below — refresh them on the host first (e.g. `ada credentials update
      # --account <acct> --role Admin --provider isengard --once`). Without
      # valid creds the classify step is skipped and events export untagged.
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    volumes:
      - ./frontend:/out
      # Mount the data dir read-write so the classification cache
      # (data/classifications.json) the classifier writes persists back to the
      # host and can be committed — otherwise `--rm` discards it and every run
      # re-classifies from scratch ("classify once, cache forever" needs this).
      - ./service/data:/app/data
      # Read-only mount of the host AWS creds/config so the classifier can call
      # Bedrock. The container runs as root, so they land at /root/.aws.
      - "${HOME}/.aws:/root/.aws:ro"
    depends_on:
      - db

volumes:
  pgdata:
